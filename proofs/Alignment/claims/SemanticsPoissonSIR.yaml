  text: |-
    **Rempała's quotient from the general SIR lift, with the design's map `(qξe^{μ(θ−1)}, φ_I)`, for `μ ≠ 0` (M3, SIR case).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M3): "EB_{Pois μ}(P) → MA(E_μ P), E_μ P = c_μ P + {J_r → ∅ at τ_r} on the edge copies; π = (θ, φ, pop) ↦ (qξe^{μ(θ−1)}, φ). For SIR: MA(β = μτ, γ_MA = γ + τ). **The MA "I" is φ_I, not prevalence**".
    [...]
    On the slice `ξ = 1` the map is `(q e^{μ(θ−1)}, φ_I)` (`NEP.rempala_lift`).
  kind: dynamical
  impl:
  - NEP.rempala_lift_xi
  - NEP.rempala_lift
  supporting: []
  impl_note: 'rempala_lift_xi (μ τ γ q) (μ ≠ 0): IsSemiconj (ebSys (poisson μ) q (sirRxns τ γ)) (maSIR (μτ) (γ+τ)) (fun u => (q * u.2.1 * exp (μ * (u.1 − 1)), u.2.2.1 .I)) (global, any ξ). rempala_lift (μ ≠ 0): IsSemiconjOn … {u | u.2.1 = 1} (poisMap μ q ∘ sirChart), map (q e^{μ(θ−1)}, φ_I).'
  required: true
  status: implemented
  notes: 'Remediation: the text is re-cited from the new theorem rempala_lift_xi (in NetworkEpi.Morphisms.Rempala), whose title quotes μ ≠ 0 and the ξ-dependent map; impl [rempala_lift_xi, rempala_lift]. Text changed: re-shadow blind.'
