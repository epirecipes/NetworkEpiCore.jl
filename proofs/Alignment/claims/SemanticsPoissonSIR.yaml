- id: SemanticsPoissonSIR.rempala
  group: SemanticsPoissonSIR
  source:
    file: NetworkEpi/Semantics/PoissonSIR.lean
    lines: 69-85
  text: |-
    **Rempała's theorem for SIR as a semiconjugacy (M3, SIR case).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M3): "**Rempała quotient** ("back to mass action on the same species") | EB_{Pois μ}(P) → MA(E_μ P), E_μ P = c_μ P + {J_r → ∅ at τ_r} on the edge copies; π = (θ, φ, pop) ↦ (qξe^{μ(θ−1)}, φ). For SIR: MA(β = μτ, γ_MA = γ + τ). **The MA "I" is φ_I, not prevalence** | natural semiconjugacy (surjective submersion) | **[L]** `NEP.rempala` (SIR)".
    [...]
    The design's "surjective submersion" holds for `μ ≠ 0` and `q > 0`, onto the mass-action states with `S > 0` (`rempala_quotient_sir`); it fails for `μ = 0` or `q = 0`.
  kind: dynamical
  impl:
  - NEP.rempala
  - NEP.rempala_quotient_sir_spec
  supporting:
  - NEP.rempala_quotient_sir
  impl_note: 'rempala: ∀ μ τ γ q, IsSemiconj (ebPoisSIR μ τ γ q) (maSIR (μτ) (γ+τ)) (poisMap μ q), poisMap (θ, φ) = (q e^{μ(θ−1)}, φ). rempala_quotient_sir (μ q) (μ ≠ 0): (q ≠ 0 → ∀ u, Surjective (fderiv ℝ (poisMap μ q) u)) ∧ (0 < q → ∀ S I, 0 < S → ∃ u, poisMap μ q u = (S, I)).'
  required: true
  status: implemented
  notes: "Remediation: the quoted Kind column 'surjective submersion' is now stated (rempala_quotient_sir) and the provisos (μ ≠ 0, q > 0, onto S > 0) are added to the docstring's Scope sentence, quoted here. Text changed: the existing shadows S3/S4 already carry these provisos; the checker must re-sync sa_claim text. Round-4 remediation (non-blind owner, 2026-09-28): forward 3/5/6 and backward failed: rempala_quotient_sir states the submersion for q ≠ 0 (stronger than q > 0) and states no failure at μ = 0 or q = 0. New trusted theorem rempala_quotient_sir_spec (submersion and onto S > 0 for μ ≠ 0, q > 0; not a surjective submersion onto S > 0 for μ = 0, nor for q = 0) replaces it in the impl; rempala_quotient_sir is supporting. CITABLE: rempala_quotient_sir replaced by rempala_quotient_sir_spec. Impl changed: checker update needed."
