- id: SemanticsPoissonSIR.ebPoisSIRLift
  group: SemanticsPoissonSIR
  source:
    file: NetworkEpi/Semantics/PoissonSIR.lean
    lines: 249-252
  text: '**`ebPoisSIR` is the SIR EBCM of the general lift.** For `μ ≠ 0`, the chart `(θ, ξ, φ, pop) ↦
    (θ, φ_I)` is a local semiconjugacy on `{ξ = 1}` from the general EB model `ebSys (CNet.poisson μ)
    q (sirRxns τ γ)` (the per-reaction lift of `s + I → I + I` at τ and `I → R` at γ on a Poisson(μ) network)
    to `ebPoisSIR μ τ γ q`.'
  kind: dynamical
  impl:
  - NEP.ebPoisSIR_lift
  supporting: []
  impl_note: μ ≠ 0 → IsSemiconjOn (ebSys (CNet.poisson μ) q (sirRxns τ γ)) (ebPoisSIR μ τ γ q) {u | u.2.1
    = 1} sirChart, with sirChart (θ, ξ, φ, pop) = (θ, φ I).
  required: true
  status: implemented
  notes: ''
- id: SemanticsPoissonSIR.rempalaLift
  group: SemanticsPoissonSIR
  source:
