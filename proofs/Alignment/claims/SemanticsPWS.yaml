- id: SemanticsPWS.pwSGlueNotStrict
  group: SemanticsPWS
  source:
    file: NetworkEpi/Semantics/PWS.lean
    lines: 105-111
  text: '**F2: the S-anchored pairwise field is not strict under gluing.** Design statement (DESIGN_NetworkEpiCore.md
    §D.6): "**F2/F2′** same for PW, PW^S, PB, clustered EB | **no** (lax) | a contact drains [Z s] (or
    triangle pairs) for every Z | Lean witness (stretch, L3)"; §D.4: "A PW^S contact drains every [Z s]
    through the closed triple [Z s J]. When B''s species are glued in, A''s contacts must also drain [Z_B
    s], which A''s system does not contain. So PW^S(glue(A,B)) ≠ glue(PW^S A, PW^S B)."'
  kind: categorical
  impl:
  - NEP.pwS_glue_not_strict_all
  - NEP.pwS_glue_not_strict_witness
  supporting:
  - NEP.pwS_glue_not_strict
  impl_note: 'A single explicit witness: K = 1, A = f2A = [s + I → I + I at τ = 1] over Unit, B = f2B
    = [s → V at ν = 1] over Unit, glued along Sum.inl, Sum.inr (only s shared), state f2State ([s] = [ss]
    = 1, [sZ] = 1, [Z] = 0): pwSLift 1 (glued) f2State ≠ pushPW inl (pwSLift 1 f2A (pullPW inl f2State))
    + pushPW inr (pwSLift 1 f2B (pullPW inr f2State)). So ''PW^S(glue(A,B)) ≠ glue(PW^S A, PW^S B)'' holds
    for this A, B (failure of strictness as a universal law), not for all A, B. NOT IN IMPL: ''lax'' (existence
    of a comparison map) is not formalised; PW, PB, clustered EB (named in the design row) and F2′ are
    not formalised; only the constant-K closure PW^S. ''drains every [Z s] through the closed triple [Z
    s J]'' is the mechanism, visible in the witness component [sV] (f2_glued_sV, f2_sum_sV) but not stated
    as a general law.'
  required: true
  status: implemented
  notes: "Citable: NEP.pwS_glue_not_strict. Remediation (SA-PASS triage): new trusted theorem in the text's form: pwS_glue_not_strict_all (K) is the negation of the gluing law for every K (witness inside the proof, [sI] components −2 vs −1); the K = 1 concrete witness pwS_glue_not_strict is supporting. Round-4 remediation (non-blind owner, 2026-09-28): forward 1/2 failed: pwS_glue_not_strict_all is a bare negation with no exported witness gluing. New trusted theorem pwS_glue_not_strict_witness (for every K, an explicit gluing cospan with injective, jointly surjective legs on which the two PW^S fields differ) added to the impl and to CITABLE. Impl changed: checker update needed."
