- id: MorphismsPoisson.poissonEbField
  group: MorphismsPoisson
  source:
    file: NetworkEpi/Morphisms/Poisson.lean
    lines: 132-134
  text: '**Per-reaction identity behind M2.** On the Poisson(μ) network with `μ ≠ 0`, the derivative of
    `poissonMap` carries the EB field of each T_EB reaction `r` to the multiset mass-action field of `D_μ
    r` at the image point.'
  kind: algebraic-identity
  impl:
  - NEP.poisson_ebField_fderiv
  supporting:
  - NEP.poisson_ebField
  impl_note: μ ≠ 0 → poissonDL μ q u (ebField (CNet.poisson μ) q r u) = sLift (r.poissonD μ) (poissonMap
    μ q u). "The derivative" is poissonDL.
  required: true
  status: implemented
  notes: 'Remediation (SA-PASS triage): new trusted theorem in the text''s form: poisson_ebField_fderiv states the identity with fderiv for finite σ (the standing hypothesis); poisson_ebField (any σ, explicit poissonDL) is supporting.'
