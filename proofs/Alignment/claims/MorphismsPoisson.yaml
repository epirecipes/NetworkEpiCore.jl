    −μτ S Φ_I, F Φ_I = μτ S Φ_I − τ Φ_I − γ Φ_I, F Φ_R = γ Φ_I, F I = μτ S Φ_I − γ I, F R = γ I (S = v
    none, Φ_X = v (some (inl X)), X = v (some (inr X))). The design quote describes D_μ in general; the
    title names the SIR equations without stating them.'
  required: true
  status: implemented
  notes: ''
