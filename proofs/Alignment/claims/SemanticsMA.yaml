# Conventions
#   id      <Group>.<lowerCamelTheoremName> for a theorem docstring (namespace prefix only where two
#           theorems share a last component); '.b', '.c' for further claims of the same docstring;
#           <Group>.header.<slug> for module-header prose/tables; <Group>.<lowerCamelDefName> for a
#           claim made in the docstring of a definition or instance.
#   text    VERBATIM (whitespace-normalised) quote; fragments separated by a line '[...]'. Lean comment
#           delimiters are not part of the text. For a citable theorem the text is the bold title plus the
#           full 'Design statement' paragraph. 'Lean statement:' paragraphs are NOT quoted (they transcribe
#           the Lean statement and would leak it to blind shadow authors). 'Scope:' sentences are
#           registered separately only when they assert mathematics.
#   status  implemented -> impl lists trusted theorems; required: true
#           missing     -> checkable mathematical claim that no trusted theorem states
#           informal    -> definitional / interpretive / meta prose, Mathlib background facts, or a
