- id: Docs.readme.sinkSpecies
  group: Docs
  source:
    file: README.md
    lines: 39-41
  text: '`Rxn.exit (Y : σ)` cannot express `s → ∅`, which §B.2 allows ("Y ∉ Σ (or ∅)"). Model it with
    an inert sink species `D`, one that occurs in no other reaction. No other coordinate of the EB field
    depends on φ_D or pop_D, so θ, ξ, S and the other φ, pop are unchanged.'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'No theorem states that for an inert sink species D (occurring in no other reaction) the
    coordinates other than φ_D, pop_D of the EB field (hence θ, ξ, S and the other φ, pop) do not depend
    on φ_D, pop_D, or that the model with s → D agrees with s → ∅. "Rxn.exit (Y : σ) cannot express s
    → ∅" holds by the type of the constructor.'
  required: false
  status: missing
  notes: The same modelling remark is in the NetworkEpi/Syntax/Rxn.lean header (group SyntaxRxn).
