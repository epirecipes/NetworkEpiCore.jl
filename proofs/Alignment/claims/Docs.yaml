- id: Docs.readme.timeIntervalSolutions
  group: Docs
  source:
    file: README.md
    lines: 31-36
  text: '**Solutions live on a time interval.** `conservation`, `node_conservation`, `xi_const` and `rempala_solution`
    take any convex set of times `I ∋ 0` (for example `(a, b)`, `[0, T)`, `[0, ∞)`) and a curve with `HasDerivWithinAt
    x (F (x t)) I t` for `t ∈ I`. That derivative is one-sided at end points of `I`, and `HasDerivAt`
    implies it. The degree data need derivative relations only at the visited θ values, so a negative
    binomial PGF (pole at 1/(1 − p) > 1) is covered.'
  kind: other
  impl: []
  supporting: []
  impl_note: Meta description of the hypotheses of conservation, node_conservation, xi_const and rempala_solution
    (convex I ∋ 0, HasDerivWithinAt; derivative relations only at visited θ). "HasDerivAt implies it"
    is a Mathlib fact.
  required: false
  status: informal
  notes: Checked against those statements by their own claims (groups SemanticsEB, SemanticsPoissonSIR).
