- id: Docs.readme.dynGeneralisation
  group: Docs
  source:
    file: README.md
    lines: 24-26
  text: '`DynSys` is more general than the design''s **Dyn**. `V` is any real normed space, `F` is any
    function and morphisms need only be differentiable. **Dyn** (finite-dimensional, C¹) is a subcategory,
    so every statement about all objects or all morphisms also holds there.'
  kind: categorical
  impl: []
  supporting: []
  impl_note: 'Definitional: DynSys (any real normed space V, any F : V → V; morphisms = differentiable
    maps with fderiv π u (F u) = G (π u)). The subcategory inclusion of the design''s Dyn is not formalised
    as a functor; the sentence is a meta-remark about quantifiers.'
  required: false
  status: informal
  notes: Also stated in the NetworkEpi/Dyn/Basic.lean header (group DynBasic).
