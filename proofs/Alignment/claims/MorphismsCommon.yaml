- id: MorphismsCommon.ebSys1Incl
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: 328-330
  text: '**For an exit-free model, the EB model on `(θ, φ, pop)` is the restriction of the EB model to
    the invariant slice `ξ = 1`**: `(θ, φ, pop) ↦ (θ, 1, φ, pop)` is a semiconjugacy from `ebSys1` to
    `ebSys` (the ξ-component of the EB field vanishes without exits).'
  kind: dynamical
  impl:
  - NEP.ebSys1_incl
  - NEP.lift_ξ_eq_zero
  - NEP.ebSys_xi_slice_invariant
  supporting: []
  impl_note: (∀ r ∈ rs, r.isExit = false) → IsSemiconj (ebSys1 N q rs) (ebSys N q rs) EB1.incl, for finite
    σ with decidable equality, any N (no derivative relations) and q. ebSys1 is defined for every model
    by F w = EB.drop (lift N q rs (EB1.incl w)); the invariance of the slice ξ = 1 is expressed by the
    semiconjugacy (ξ-component of lift is 0 without exits), not by a separate invariance statement.
  required: true
  status: implemented
  notes: 'Remediation (SA-PASS triage): re-registered to the theorems that state the text (the parenthetical ''the ξ-component of the EB field vanishes without exits'' is lift_ξ_eq_zero; ''invariant slice ξ = 1'' is ebSys_xi_slice_invariant).'
