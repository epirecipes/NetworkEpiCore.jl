- id: MorphismsCommon.clmListSumEq
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: 52-54
  text: '**The per-reaction criterion.** If a continuous linear map `L` carries each per-reaction source
    term `f r` to the per-reaction target term `g r`, it carries the sum over the reaction list to the
    sum.'
  kind: algebraic-identity
  impl:
  - NEP.clm_list_sum_eq
  supporting: []
  impl_note: (∀ r ∈ rs, L (f r) = g r) → L ((rs.map f).sum) = (rs.map g).sum. The hypothesis is only for
    members of the list.
  required: true
  status: implemented
  notes: ''
- id: MorphismsCommon.isConjOn
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: '77-79,17-18'
  text: |-
    When `V` and `U` are invariant, this is a conjugacy (an isomorphism of `DynSys`) between the restrictions of `A` to `V` and of `B` to `U`: `h` maps solutions that stay in `V` to solutions, and `g` maps solutions that stay in `U` back.
    [...]
    conjugacies (isomorphisms of `DynSys` between restrictions)
  kind: categorical
  impl: []
  supporting:
  - NEP.SemiconjOn.map_solution_on
  - NEP.SemiconjOn.map_solution_within
  impl_note: 'IsConjOn A B V U h g is a Prop-valued definition: IsSemiconjOn A B V h ∧ IsSemiconjOn B
    A U g ∧ h maps V into U ∧ g maps U into V ∧ g ∘ h = id on V ∧ h ∘ g = id on U. No theorem builds the
    restricted DynSys objects on invariant V, U or an isomorphism in the category DynSys from it, and
    none states that h (resp. g) maps solutions staying in V (resp. U) to solutions for an IsConjOn pair
    (this follows from SemiconjOn.map_solution_on/within applied to each component, which is not stated
    for IsConjOn). IsConjOn requires neither invariance nor openness of V, U.'
  required: false
  status: missing
  notes: 'Docstring of the DEFINITION IsConjOn plus the matching header phrase. Relevant to every claim
    whose Lean statement is an IsConjOn (MorphismsWellMixed.wellmixedUnit, MorphismsPoisson.poissonIso*,
    MorphismsCompact.compactConj): there "conjugacy" means IsConjOn, not a diffeomorphism of invariant
    subsystems.'
- id: MorphismsCommon.isSemiconjOnInverse
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: '85-89,18'
  text: |-
    **A differentiable inverse of a semiconjugacy is a semiconjugacy.** Let `h` be a local semiconjugacy on `V` from `A` to `B`, and let `g : B.V → A.V` be a global left inverse of `h` (`g ∘ h = id`) that is differentiable at every point of `U`, maps `U` into `V` and is a right inverse on `U` (`h (g v) = v` for `v ∈ U`). Then `g` is a local semiconjugacy on `U` from `B` to `A`.
    [...]
    the fact that a differentiable two-sided inverse of a semiconjugacy is one
  kind: dynamical
  impl:
  - NEP.isSemiconjOn_inverse
  supporting: []
  impl_note: IsSemiconjOn A B V h → (∀ v ∈ U, DifferentiableAt ℝ g v) → (∀ v ∈ U, g v ∈ V) → (∀ u, g (h
    u) = u) → (∀ v ∈ U, h (g v) = v) → IsSemiconjOn B A U g. The left-inverse hypothesis is global (all
    u), as the docstring says; the header's "two-sided inverse" is this mix of a global left inverse and
    a right inverse on U.
  required: true
  status: implemented
  notes: 'The parenthetical proof hint "(Chain rule: ...)" is not quoted.'
- id: MorphismsCommon.isConjOnOfInverse
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: 106-107
  text: 'A conjugacy with `V = univ` built from a global semiconjugacy `h` and a differentiable inverse
    `g` on `U`: `IsConjOn A B univ U h g`.'
  kind: categorical
  impl:
  - NEP.isConjOn_of_inverse
  supporting: []
  impl_note: IsSemiconj A B h → (∀ v ∈ U, DifferentiableAt ℝ g v) → (∀ u, h u ∈ U) → (∀ u, g (h u) = u)
    → (∀ v ∈ U, h (g v) = v) → IsConjOn A B univ U h g. The text leaves these hypotheses implicit in "a
    differentiable inverse g on U".
  required: true
  status: implemented
  notes: ''
