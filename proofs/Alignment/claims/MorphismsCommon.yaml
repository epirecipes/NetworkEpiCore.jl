# SA-PASS claim registry fragment: group MorphismsCommon
# Source: NetworkEpi/Morphisms/Common.lean  (paths relative to proofs/)
# Registrar: claim registrar 2/2 (non-blind), WP4-style SA-PASS on the NetworkEpi library.
#
# Conventions
#   id       <Group>.<lowerCamelTheoremName> for a theorem docstring; <Group>.header.<slug> for
#            module-header prose; <Group>.<slug> for a gap or remark stated in a docstring.
#   text     VERBATIM (whitespace-normalised) quote of the cited lines; non-adjacent fragments are
#            separated by a line '[...]'. Lean comment delimiters are not part of the text.
#            For a citable theorem: the bold title and the "Design statement" paragraph, plus
#            natural-language claim sentences of the docstring that are not transcriptions of the
#            Lean statement (e.g. "No condition on ... is needed", a Scope sentence that names the
#            part of the design statement being claimed), plus the module-header "Results" bullet
#            for that theorem (without the leading theorem name). The "Lean statement:" paragraph
#            is never quoted (it transcribes the formal statement).
#   status   implemented -> impl lists trusted theorems; required: true
#            missing     -> checkable claim with no implementing theorem (coverage gap)
#            informal    -> definitional, interpretive or meta prose, or an index entry that
#                           restates a claim registered elsewhere (see notes)
#   Each CITABLE.txt name is the impl of exactly one required claim.
#   impl_note/notes describe the Lean statements: BLIND shadow authors must not read this file.
- id: MorphismsCommon.header.perReactionCriterion
  group: MorphismsCommon
  source:
    file: NetworkEpi/Morphisms/Common.lean
    lines: 13-16
  text: Every field in this library is a sum of per-reaction fields, and the derivative of a map is linear,
    so a map is a semiconjugacy as soon as its derivative carries each per-reaction source field to the
    corresponding per-reaction target field.
  kind: dynamical
  impl:
  - NEP.ebSys_F_eq_sum
  - NEP.maSys_F_eq_sum
  - NEP.isSemiconj_of_perReaction
  supporting:
  - NEP.isSemiconj_of_hasFDerivAt
  - NEP.clm_list_sum_eq
  impl_note: 'No single theorem: the criterion is the conjunction of isSemiconj_of_hasFDerivAt (explicit
    derivative D u with D u (A.F u) = B.F (π u) for all u gives IsSemiconj A B π) and clm_list_sum_eq
    (a continuous linear map that carries each f r, r ∈ rs, to g r carries (rs.map f).sum to (rs.map g).sum).
    "Every field in this library is a sum of per-reaction fields" is definitional (lift, maLift, sLift,
    wmLift, pgfLift, pwSLift are List.sum of per-reaction fields), not a theorem.'
  required: true
  status: implemented
  notes: 'Module header prose. The sentence "This is how the general-P theorems are proved" is meta and not quoted. Remediation (SA-PASS triage): re-registered to the theorems that state the text (the ebSys/maSys fields are sums of per-reaction fields; the per-reaction criterion for a semiconjugacy).'
