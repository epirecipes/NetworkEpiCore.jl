- id: DynBasic.mapSolution
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: '109-112,87-89'
  text: |-
    **Semiconjugacies map solutions to solutions.** Design statement (DESIGN_NetworkEpiCore.md §D.3): "[L] `instance : Category DynSys` and `Semiconj.map_solution` (semiconjugacies map solution curves to solution curves)".
    [...]
    **The category `DynSys`** (DESIGN §D.3: "[L] `instance : Category DynSys`"). Objects are `DynSys`, morphisms `A ⟶ B` are `Semiconj A B`, the identity is `id` and composition is composition of maps (`comp_π`, `id_π`).
  kind: dynamical
  impl:
  - NEP.Semiconj.map_solution_global
  - NEP.Semiconj.map_solution_open
  - NEP.hom_eq_semiconj
  - NEP.id_π
  - NEP.comp_π
  supporting:
  - NEP.Semiconj.map_solution
  impl_note: 'Semiconj.map_solution: for m : Semiconj A B, any set of times I : Set ℝ and x : ℝ → A.V
    with HasDerivAt x (A.F (x t)) t for every t ∈ I, HasDerivAt (m.π ∘ x) (B.F (m.π (x t))) t for every
    t ∈ I (I = univ gives global solutions; I is an arbitrary set, no interval required). ''Solution curve''
    is read pointwise via HasDerivAt. The ''[L] instance : Category DynSys'' part: the instance dynCategory
    is a definition; its content is stated by hom_eq_semiconj ((A ⟶ B) = Semiconj A B), id_π (π of 𝟙 A
    is id) and comp_π (π of f ≫ g is g.π ∘ f.π). The category laws hold by rfl inside the instance and
    are not separate theorems. DynSys generalises the design''s Dyn (any real normed space, any F, morphisms
    differentiable rather than C¹), so the statement is about DynSys, not about a formalised Dyn.'
  required: true
  status: implemented
  notes: "Citable: NEP.Semiconj.map_solution. Merged claim: the design statement of map_solution bundles the category instance, so the instance docstring (lines 87-89) and the three theorems describing the instance are part of this claim. Round-4 remediation (non-blind owner, 2026-09-28): backward failed because Semiconj.map_solution (pointwise on ANY set I) is stronger than S1 (global) and S2 (open interval). New exact-statement corollaries Semiconj.map_solution_global and Semiconj.map_solution_open are the impl; the stronger theorem is supporting. CITABLE: NEP.Semiconj.map_solution replaced by the two corollaries. Impl changed: checker update needed (text unchanged, shadows unchanged)."
