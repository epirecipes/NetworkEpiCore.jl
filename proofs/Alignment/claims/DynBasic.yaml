- id: DynBasic.header.dynDesign
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 17-19
  text: 'The design (§D.3) says: "Objects of **Dyn** are (V, F): V a finite-dimensional real normed space,
    F: V → V a C¹ vector field. Morphisms (V, F) → (W, G) are C¹ maps π with Dπ(u)·F(u) = G(π(u)) (semiconjugacies).
    Identity and composition come from the chain rule."'
  kind: categorical
  impl: []
  supporting: []
  impl_note: The design's definition of Dyn (finite-dimensional V, C¹ field, C¹ semiconjugacies). There
    is no Lean definition of Dyn. 'Identity and composition come from the chain rule' corresponds to the
    definitions Semiconj.id and Semiconj.comp (data whose proof fields use the chain rule), not to a theorem.
  required: false
  status: informal
  notes: Definitional design quote; the Lean counterpart is the generalised category DynSys.
- id: DynBasic.header.dynSysGeneral
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 21-24
  text: 'The Lean category `DynSys` is deliberately *more general*: `V` is any real normed space (not
    necessarily finite-dimensional), `F` is any function `V → V` (no regularity), and a morphism is a
    map that is differentiable everywhere (not necessarily C¹) and satisfies `fderiv ℝ π u (F u) = G (π
    u)` for every `u`.'
  kind: categorical
  impl: []
  supporting: []
  impl_note: 'Describes the definitions DynSys (V : Type with NormedAddCommGroup, NormedSpace ℝ; F : V
    → V) and Semiconj (π, diff : Differentiable ℝ π, comm : ∀ u, fderiv ℝ π u (A.F u) = B.F (π u)). No
    theorem.'
  required: false
  status: informal
  notes: Definitional.
