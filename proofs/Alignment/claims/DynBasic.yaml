- id: DynBasic.mapSolutionOn
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 212-216
  text: |-
    **Local semiconjugacies map solutions that stay in `U` to solutions.** Design statement (DESIGN_NetworkEpiCore.md §D.3): "**Local version `SemiconjOn U`.** The identity holds on an open set U, and solutions that stay in U are mapped. This is needed for maps that divide by ψ(θ) or ψ'(θ)."
  kind: dynamical
  impl:
  - NEP.SemiconjOn.map_solution_on_global
  - NEP.SemiconjOn.map_solution_on_open
  supporting:
  - NEP.SemiconjOn.map_solution_on
  impl_note: 'For m : SemiconjOn A B U (π differentiable at each u ∈ U, fderiv ℝ π u (A.F u) = B.F (π
    u) for u ∈ U), any I : Set ℝ and x with HasDerivAt x (A.F (x t)) t and x t ∈ U for every t ∈ I: HasDerivAt
    (m.π ∘ x) (B.F (m.π (x t))) t for every t ∈ I. U is NOT required to be open (the design says ''an
    open set U''; the SemiconjOn docstring explains that pointwise differentiability on U replaces openness),
    so the Lean notion is more general. ''This is needed for maps that divide by ψ(θ) or ψ''(θ)'' is motivation,
    not formalised.'
  required: true
  status: implemented
  notes: "Citable: NEP.SemiconjOn.map_solution_on. The same design statement is quoted by DynBasic.semiconjOnMapSolutionWithin. Round-4 remediation (non-blind owner, 2026-09-28): backward failed (impl pointwise on any set I is stronger than S1/S2). New exact-statement corollaries SemiconjOn.map_solution_on_global / _open are the impl; SemiconjOn.map_solution_on is supporting. CITABLE: NEP.SemiconjOn.map_solution_on replaced by the two corollaries. Impl changed: checker update needed."
