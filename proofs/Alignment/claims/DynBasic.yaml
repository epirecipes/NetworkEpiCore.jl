- id: DynBasic.invariantIncl
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 303-306
  text: '**The inclusion of an invariant subsystem is a semiconjugacy (a restriction).** Design statement
    (DESIGN_NetworkEpiCore.md §D.3): "The inclusion of an invariant subsystem is a restriction. "Model
    A is exact for initial conditions in W" is a morphism *out of* (W, F|_W)."'
  kind: categorical
  impl:
  - NEP.invariant_incl
  supporting: []
  impl_note: 'For A : DynSys, p₀ : A.V, a linear subspace W : Submodule ℝ A.V and hW : ∀ w ∈ W, A.F (p₀
    + w) ∈ W (F tangent to the affine subspace p₀ + W): IsSemiconj (A.restrict p₀ W hW) A (A.restrictIncl
    p₀ W), where restrict has state space W and field w ↦ F(p₀ + w) and restrictIncl is w ↦ p₀ + w. ''Invariant
    subsystem'' is read as an affine subspace to which F is tangent (no general invariant set or submanifold).
    The quoted interpretation (''Model A is exact for initial conditions in W is a morphism out of (W,
    F|_W)'') is not formalised beyond the existence of this morphism into A.'
  required: true
  status: implemented
  notes: 'Citable: NEP.invariant_incl.'
