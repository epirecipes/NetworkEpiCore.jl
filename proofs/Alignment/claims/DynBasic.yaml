- id: DynBasic.header.solutionDefs
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 28-31
  text: 'A *solution* of `(V, F)` on a set of times `I` is a curve `x : ℝ → V` with `HasDerivAt x (F (x
    t)) t` for every `t ∈ I` (`map_solution`, `map_solution_on`), or, on a time interval that may contain
    its end points (for example a forward solution on `[0, T)`), with `HasDerivWithinAt x (F (x t)) I
    t` for every `t ∈ I` (`map_solution_within`).'
  kind: dynamical
  impl: []
  supporting: []
  impl_note: Definition of 'solution on I' used in the hypotheses of map_solution, map_solution_on (HasDerivAt
    at each t ∈ I) and map_solution_within (HasDerivWithinAt x (F (x t)) I t at each t ∈ I). No Lean definition
    of 'solution'; the hypothesis is spelled out in each theorem.
  required: false
  status: informal
  notes: Definitional.
