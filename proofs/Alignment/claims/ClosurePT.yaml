- id: ClosurePT.poissonClosureK
  group: ClosurePT
  source:
    file: NetworkEpi/Closure/PT.lean
    lines: '182-185,21'
  text: |-
    **The Poisson PGF is of Poisson type with κ = 1 (M8, Poisson instance).** Design statement (DESIGN_NetworkEpiCore.md §0): "**Poisson type (PT).** A degree PGF ψ is PT if ψ' = αψ^κ. This covers Poisson (κ = 1)".
    [...]
    the Poisson PGF is PT with `α = μ`, `κ = 1`.
  kind: algebraic-identity
  impl:
  - NEP.poisson_isPT
  supporting:
  - NEP.poisson_closureK
  impl_note: 'μ ≠ 0 → ∀ x, (CNet.poisson μ).ψ'' x = μ * (CNet.poisson μ).ψ x ^ (1 : ℝ) ∧ (CNet.poisson
    μ).closureK x = 1. PT holds on all of ℝ with α = μ, κ = 1 (pointwise statement; no interval).'
  required: true
  status: implemented
  notes: 'Remediation: impl poisson_closureK -> poisson_isPT (every μ; no μ ≠ 0, no closureK conjunct). Text unchanged.'
