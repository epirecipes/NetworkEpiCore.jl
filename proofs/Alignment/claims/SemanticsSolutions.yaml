    functor EB_N on Open(Petri/T_EB) is not formalised (no functor; only that each T_EB reaction list
    gives a C^n field).'
  required: true
  status: implemented
  notes: 'Citable: NEP.ebSys_mem_dyn (NEP.contDiff_lift, now supporting, was removed from CITABLE.txt on 2026-09-28). The Scope sentence (pointwise regularity covers PGFs with a pole) refers to contDiffAt_lift. Remediation (SA-PASS triage): re-registered to the theorem that states the text''s form (FiniteDimensional ∧ ContDiff 1: the object of Dyn).'
- id: SemanticsSolutions.existsLocalSolution
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 205-207
  text: '**Local existence of EB solutions (Picard–Lindelöf).** For every T_EB reaction list `rs` and
    every state `u₀` such that ψ, ψ'' and ψ'''' are `C¹` at `θ = u₀.1`, there are `ε > 0` and a curve
    `x` with `x 0 = u₀` that solves the EB field of `rs` (`HasDerivAt`) at every `t ∈ (−ε, ε)`.'
  kind: existence
  impl:
  - NEP.exists_local_solution
  supporting: []
  impl_note: ContDiffAt ℝ 1 of ψ, ψ', ψ'' at u₀.1 → ∃ ε > 0, ∃ x, x 0 = u₀ ∧ ∀ t ∈ Ioo (−ε) ε, HasDerivAt
    x (lift N q rs (x t)) t (σ finite). 'Picard–Lindelöf' is the proof method.
  required: true
  status: implemented
  notes: ''
- id: SemanticsSolutions.conservationLocal
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 218-221
  text: '**Edge conservation along a local EB solution from the design''s initial condition.** Design
    statement (DESIGN_NetworkEpiCore.md §D.4, Evidence): "The exit terms were checked by hand. Conservation
    θ = φ_S + Σφ_X holds."'
  kind: existence
  impl:
  - NEP.conservation_local_within
  supporting:
  - NEP.conservation_local
  impl_note: 'Hypotheses: ψ''(1) ≠ 0; ψ, ψ'', ψ'''' C¹ at 1; HasDerivAt ψ'' (ψ'''' θ) θ for θ eventually
    near 1; rs has no removal X → ∅; φ₀, p₀ : σ → ℝ with Σ φ₀ = 1 − q. Conclusion: ∃ ε > 0, ∃ x, x 0 =
    (1, 1, φ₀, p₀), x solves the EB field of rs (HasDerivAt) on (−ε, ε), and θ(t) = φ_S(t) + Σ_X φ_X(t)
    on (−ε, ε). This is existence of ONE local solution along which conservation holds (conservation along
    every solution is NEP.conservation). The design statement is unqualified; the no-removal hypothesis,
    ψ''(1) ≠ 0 and the regularity hypotheses are not in it. ''The exit terms were checked by hand'' is
    meta.'
  required: true
  status: implemented
  notes: 'Citable: NEP.conservation_local_within (NEP.conservation_local, now supporting, was removed from CITABLE.txt on 2026-09-28). Same design statement as SemanticsEB.conservation. Remediation (SA-PASS triage): re-registered to the theorem that states the text''s form (HasDerivWithinAt on the interval). Needs the isRemoval bridge registered for this claim.'
