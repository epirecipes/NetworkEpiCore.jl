# Conventions
#   id      <Group>.<lowerCamelTheoremName> for a theorem docstring (namespace prefix only where two
#           theorems share a last component); '.b', '.c' for further claims of the same docstring;
#           <Group>.header.<slug> for module-header prose/tables; <Group>.<lowerCamelDefName> for a
#           claim made in the docstring of a definition or instance.
#   text    VERBATIM (whitespace-normalised) quote; fragments separated by a line '[...]'. Lean comment
#           delimiters are not part of the text. For a citable theorem the text is the bold title plus the
#           full 'Design statement' paragraph. 'Lean statement:' paragraphs are NOT quoted (they transcribe
#           the Lean statement and would leak it to blind shadow authors). 'Scope:' sentences are
#           registered separately only when they assert mathematics.
#   status  implemented -> impl lists trusted theorems; required: true
#           missing     -> checkable mathematical claim that no trusted theorem states
#           informal    -> definitional / interpretive / meta prose, Mathlib background facts, or a
#                          summary of a claim registered elsewhere (see supporting + notes)
#   Merged claims: where several theorems of one module quote overlapping design statements that
#           name each other, they form ONE claim whose impl lists all of them (each citable name is the
#           impl of exactly one required claim).
#   impl_note / notes describe the Lean statements: BLIND shadow authors must not read this file.
- id: SemanticsSolutions.header.hypothesesMet
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 11-12
  text: 'The conservation laws of `NetworkEpi.Semantics.EB` are stated for solutions on a time interval
    `I ∋ 0`. This module shows that their hypotheses can be met for every T_EB model:'
  kind: existence
  impl: []
  supporting:
  - NEP.conservation_local
  - NEP.exists_local_solution
  impl_note: conservation_local shows the hypotheses of conservation met together only for REMOVAL-FREE
    T_EB models whose ψ, ψ', ψ'' are C¹ at 1, with ψ'' = (ψ')' near 1 and ψ'(1) ≠ 0. For a model with
    a removal X → ∅ the hypothesis 'no removal' of conservation (and node_conservation) cannot be met,
    so 'for every T_EB model' is not implemented (it holds after lowering removals to a sink species,
    DESIGN §J.2).
  required: false
  status: missing
  notes: 'ALIGNMENT: ''for every T_EB model'' overstates what conservation_local shows.'
- id: SemanticsSolutions.header.bullets
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 14-24
  text: '* `contDiffAt_lift`: the EB field `lift N q rs` is `C^n` at every state whose θ is a point where
    ψ, ψ'', ψ'''' are `C^n`. `contDiff_lift`: if ψ, ψ'', ψ'''' are `C¹` everywhere (for example Poisson),
    the EB model `ebSys N q rs` is an object of the design''s category **Dyn**. * `exists_local_solution`:
    by the Picard–Lindelöf theorem, from every such state there is a solution on an open interval `(−ε,
    ε)`. * `conservation_local`: for every removal-free T_EB model on a network whose degree data are
    `C¹` near θ = 1, with `ψ''''` the derivative of `ψ''` near 1 and `ψ''(1) ≠ 0`, there is a solution
    on some `(−ε, ε)` from the design''s initial condition, and `θ = φ_S + Σ_X φ_X` holds along it. `conservation_local_poisson`
    specialises this to Poisson(μ), `μ ≠ 0`, and `seir_conservation_local` to EB SEIR on Poisson(5) with
    τ = 1/6, σ = 1/3, γ = 1/4 and φ_I(0) = 0.01: a model with no global solution (numerically, it blows
    up backward at t ≈ −7.33).'
  kind: existence
  impl: []
  supporting:
  - NEP.contDiffAt_lift
  - NEP.contDiff_lift
  - NEP.exists_local_solution
  - NEP.conservation_local
  - NEP.conservation_local_poisson
  - NEP.seir_conservation_local
  impl_note: Summaries of the theorem claims registered in this group (contDiffAtLift, contDiffLift, existsLocalSolution,
    conservationLocal, conservationLocalPoisson, seirConservationLocal). The 'no global solution (numerically
    ...)' remark is SemanticsSolutions.seirConservationLocal.b.
  required: false
  status: informal
  notes: Summary.
