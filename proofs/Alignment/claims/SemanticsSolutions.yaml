- id: SemanticsSolutions.contDiffLift
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 163-167
  text: '**EB models on a network with C¹ degree data are objects of Dyn.** Design statement (DESIGN_NetworkEpiCore.md
    §D.3): "Objects of **Dyn** are (V, F): V a finite-dimensional real normed space, F: V → V a C¹ vector
    field."; §D.4, the row of the representation functor **EB_N** with domain "Open(Petri/T_EB), N fixed".'
  kind: structural
  impl:
  - NEP.ebSys_mem_dyn
  supporting:
  - NEP.contDiff_lift
  impl_note: 'For σ finite (Fintype, DecidableEq), n : WithTop ℕ∞, ψ, ψ'', ψ'''' ContDiff ℝ n on all of
    ℝ: ContDiff ℝ n (lift N q rs) for every q and rs. ψ'' and ψ'''' need not be derivatives of ψ. ''Object
    of Dyn'' is read as n = 1 plus finite-dimensionality of EB σ = ℝ × ℝ × (σ → ℝ) × (σ → ℝ); finite-dimensionality
