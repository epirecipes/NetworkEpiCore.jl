- id: DynProducts.prodIsLimit
  group: DynProducts
  source:
    file: NetworkEpi/Dyn/Products.lean
    lines: '74-78,91,125'
  text: |-
    **`(V × W, F × G)` is the categorical product of `(V, F)` and `(W, G)` in `DynSys`.** Design statement (DESIGN_NetworkEpiCore.md §D.3): "**Products.** Dyn has binary products and a terminal object (Lean stretch L1b)"; §D.7: "L1b `NEP/Dyn/Products` | cartesian structure | `HasBinaryProducts DynSys`, terminal object".
    [...]
    **`DynSys` has binary products.**
    [...]
    **`DynSys` has a terminal object**, the zero-dimensional system `(Fin 0 → ℝ, 0)`.
  kind: categorical
  impl:
  - NEP.prod_isLimit
  - NEP.hasBinaryProducts
  - NEP.hasTerminal
  - NEP.point_isTerminal
  supporting:
  - NEP.dyn_isProduct
  - NEP.dyn_isTerminal
  impl_note: 'prod_isLimit: ∀ A B, Nonempty (IsLimit (prodFan A B)) (apex (A.V × B.V, u ↦ (A.F u.1, B.F u.2)), legs prodFst/prodSnd with maps Prod.fst/Prod.snd). hasBinaryProducts: HasBinaryProducts DynSys. hasTerminal: HasTerminal DynSys. point_isTerminal: Nonempty (IsTerminal DynSys.point), DynSys.point = (Fin 0 → ℝ, 0). dyn_isProduct / dyn_isTerminal: the design''s Dyn reading, in primitive terms: for A, B with FiniteDimensional ∧ ContDiff ℝ 1 F there are P (FiniteDimensional, C¹ field) and C¹ semiconjugacies p₁ p₂ with the universal property among C¹ semiconjugacies out of finite-dimensional C¹ systems (existence and uniqueness of the factorisation); and a finite-dimensional C¹ P receiving exactly one C¹ semiconjugacy from every finite-dimensional C¹ system.'
  required: true
  status: implemented
  notes: "Remediation (SA-PASS triage): point_isTerminal, dyn_isProduct, dyn_isTerminal added to impl (the text names the terminal object and quotes the design's 'Dyn has binary products and a terminal object'). Round-4 remediation (non-blind owner, 2026-09-28): registrar fix for the SHADOW? backward failure: the claim headline is about DynSys (\"in DynSys\"), and the design-Dyn reading is the separate claim DynProducts.header.dynClosure, whose impl keeps dyn_isProduct / dyn_isTerminal. They are removed from this impl (now supporting). Impl changed: checker update needed."
