- id: DynProducts.header.dynClosure
  group: DynProducts
  source:
    file: NetworkEpi/Dyn/Products.lean
    lines: 18-26
  text: |-
    **Scope: `DynSys`, and the closure of the design's Dyn.** `prod_isLimit`, `hasBinaryProducts`, `point_isTerminal` and `hasTerminal` are limits in `DynSys` (see `NetworkEpi.Dyn.Basic`). Because Dyn is not a full subcategory of `DynSys`, they do not by themselves imply that Dyn has these limits. The same constructions stay in the design's **Dyn** (finite-dimensional, C¹): a product of finite-dimensional spaces with C¹ fields is finite-dimensional with a C¹ field, the projections are C¹, the pairing of two C¹ maps is C¹, `Fin 0 → ℝ` is finite-dimensional with the C¹ field 0, and the maps to it are C¹ (`dyn_prod_closed`, `dyn_point_closed`). Uniqueness of the factorisation is inherited from `DynSys`, so Dyn has binary products and a terminal object, computed as in `DynSys`.
  kind: categorical
  impl:
  - NEP.dyn_prod_closed_of_dyn
  - NEP.dyn_point_closed_of_dyn
  - NEP.dyn_isProduct
  - NEP.dyn_isTerminal
  supporting:
  - NEP.dyn_prod_closed
  - NEP.dyn_point_closed
  impl_note: 'dyn_prod_closed: for A B with FiniteDimensional V and ContDiff ℝ 1 F: the product system is finite-dimensional with a C¹ field, prodFst/prodSnd maps are C¹, and prodLift of C¹ semiconjugacies is C¹. dyn_point_closed: DynSys.point is finite-dimensional, its field is C¹, every toPoint A is C¹. dyn_isProduct / dyn_isTerminal: the universal properties among finite-dimensional C¹ systems and C¹ semiconjugacies (primitive terms).'
  required: true
  status: implemented
  notes: "Remediation: the header was rewritten (the closure is now formalised); text re-anchored, status missing -> implemented. Needs a blind shadow set. Round-4 remediation (non-blind owner, 2026-09-28): backward failed because the pairing clause of dyn_prod_closed and the toPoint clause of dyn_point_closed are unconditional, stronger than S5/S8 (Dyn domains). New exact-statement theorems dyn_prod_closed_of_dyn / dyn_point_closed_of_dyn (those clauses restricted to finite-dimensional C¹ domains) replace them in the impl; the unconditional ones are supporting. CITABLE: dyn_prod_closed, dyn_point_closed replaced by the _of_dyn names. Impl changed: checker update needed."
