- id: MorphismsStoich.maFieldToSRxn
  group: MorphismsStoich
  source:
    file: NetworkEpi/Morphisms/Stoich.lean
    lines: 102-102
  text: Per reaction, the `NRxn` mass-action field is the multiset mass-action field.
  kind: algebraic-identity
  impl:
  - NEP.maField_toSRxn
  supporting: []
  impl_note: 'maToS (maField r u) = r.toSRxn.field (maToS u) for every r : NRxn σ (all six constructors)
    and u : MA σ.'
  required: true
  status: implemented
  notes: ''
