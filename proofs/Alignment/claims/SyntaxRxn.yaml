- id: SyntaxRxn.existsNotEbAdmissible
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 203-207
  text: 'T_EB ⊊ T_net: some T_net reaction is not EB-admissible (the resusceptibility `X → s`). Design
    statement (DESIGN_NetworkEpiCore.md §D.1): "**Petri/T_EB ⊂ Petri/T_net ⊂ Petri**, and the back ends
    are defined on these: EB on Petri/T_EB"; executive summary item 6: "**The EB lift is strictly partial**".'
  kind: existence
  impl:
  - NEP.NRxn.exists_not_ebAdmissible
  supporting: []
  impl_note: '∃ r : NRxn Unit, ¬ r.EBAdmissible (witness resus () 1), i.e. only for the species type Unit.
    The inclusion T_EB ⊂ T_net is the definition Rxn.toNRxn; its injectivity is Rxn.toNRxn_injective and
    ''not EB-admissible = not in the image'' is NRxn.ebAdmissible_iff (neither in impl). NOT IN IMPL:
    Petri nets (''⊂ Petri'') are not formalised; ''the back ends are defined on these: EB on Petri/T_EB''
    corresponds to ebField being defined on Rxn σ (definitional).'
  required: true
  status: implemented
  notes: 'Citable: NEP.NRxn.exists_not_ebAdmissible.'
