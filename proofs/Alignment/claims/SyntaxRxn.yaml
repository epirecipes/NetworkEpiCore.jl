- id: SyntaxRxn.header.typingTable
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 11-22
  text: |-
    The models are reaction networks on one susceptible species `s` (left implicit: it is the unique
    species of type `:sus`, DESIGN §B.2, "On an untyped network |Σ| = 1") and a type `σ` of node
    species (type `:node`). The typing of §B.2 is therefore built into the syntax:
    | constructor | §B.2 shape | §B.2 type | in T_EB? |
    |---|---|---|---|
    | `contact J X τ` | s + J → X + J (per-contact rate τ; J, X ∉ Σ; X = J allowed) | `:contact` | yes |
    | `exit Y ν` | s → Y (Y ∉ Σ) | `:exit` | yes |
    | `trans X (some Y) a` | X → Y (X, Y ∉ Σ) | `:progress` | yes |
    | `trans X none a` | X → ∅ | `:remove` | yes |
    | `NRxn.resus X a` | X → s | `:resus` | no |
    | `NRxn.nodeContact X J Y τ` | X + J → Y + J with X ∉ Σ (`J = none` is s) | `:node_contact` | no |
  kind: structural
  impl: []
  supporting:
  - NEP.NRxn.ebAdmissible_iff_type
  - NEP.NRxn.not_ebAdmissible_resus
  - NEP.NRxn.not_ebAdmissible_nodeContact
  impl_note: 'Definitional: the constructors of Rxn/NRxn, the case table NRxn.type and TNet.inTEB. The
    ''in T_EB?'' column is the composite TNet.inTEB ∘ NRxn.type; its relation to EB-admissibility is SyntaxRxn.ebAdmissibleIffType
    (and the resus/nodeContact claims).'
  required: false
  status: informal
  notes: Definitional table; covered by the admissibility claims.
- id: SyntaxRxn.header.tebTnet
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 24-27
  text: '"**T_EB** = {contact, exit, progress, remove}: the sub-theory with **no arrow into Sus**. **T_net**
    = all eight types." (§B.2). With a single susceptible species, the §B.2 types `:sus_move` (S₁ → S₂)
    cannot occur and `:sus_contact` (a contact whose product or infector is susceptible) is not represented
    by `NRxn`; neither is admissible for EB.'
  kind: structural
  impl: []
  supporting:
  - NEP.NRxn.ebAdmissible_iff_type
  impl_note: TNet has six constructors (contact, exit, progress, remove, resus, nodeContact); the design's
    T_net has eight. The paragraph explains why :sus_move and :sus_contact are absent (one susceptible
    species). No theorem; definitional.
  required: false
  status: informal
  notes: The design quote also appears in SyntaxRxn.ebAdmissibleIffType.
- id: SyntaxRxn.header.exitsToEmpty
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 29-32
  text: '**Exits to ∅.** §B.2 allows an exit `s → Y` with "Y ∉ Σ (or ∅)". The constructor `exit (Y : σ)`
    always names a node species, so `s → ∅` is not directly expressible. Model it with an *inert sink
    species* `D`: a node species that appears in no other reaction (no transition out of `D` and no contact
    with `D` as infector).'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Modelling convention: exit (Y : σ) always names a node species; s → ∅ is represented with
    an inert sink species. Definitional.'
  required: false
  status: informal
  notes: DESIGN §J.2 makes the absorbing sink species the lowering of removals and exits to ∅.
- id: SyntaxRxn.header.inertSink
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 32-35
  text: In the EB field (`NetworkEpi.Semantics.EB`) no coordinate other than `φ_D` and `pop_D` depends
    on `φ_D` or `pop_D`, so θ, ξ, S and every other `φ_X`, `pop_X` evolve exactly as for `s → ∅`. `φ_D`
    and `pop_D` then record the removed edge and node mass, and the conservation laws count it.
  kind: dynamical
  impl: []
  supporting: []
  impl_note: No theorem states that, for an inert sink D (no reaction out of D and no contact with D as
    infector), no component of the EB field other than φ_D and pop_D depends on φ_D or pop_D, nor that
    θ, ξ, S and the other φ_X, pop_X evolve as for s → ∅ (s → ∅ is not expressible in Rxn, so the comparison
    has no Lean counterpart). The conservation laws (NEP.conservation, NEP.node_conservation) require
    no removal X → ∅ and include every species in Σ_X.
  required: false
  status: missing
  notes: ''
- id: SyntaxRxn.header.admissibilityScope
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 37-43
  text: '**What the admissibility results say.** `EBAdmissible` is defined on the *syntax*: a T_net reaction
    is admissible if it lies in the image of the T_EB syntax `Rxn σ`. The results `ebAdmissible_iff_type`,
    `not_ebAdmissible_resus` and `exists_not_ebAdmissible` follow from the definitions by case analysis,
    because `EBAdmissible` and `TNet.inTEB` are parallel case tables. They say that the EB semantics of
    this library (`ebField`, defined on `Rxn σ`) has no input for `resus` or `nodeContact`. They do **not**
    prove that no EB-type semantics for `X → s` could exist.'
  kind: other
  impl: []
  supporting:
  - NEP.NRxn.ebAdmissible_iff_type
  - NEP.NRxn.not_ebAdmissible_resus
  - NEP.NRxn.exists_not_ebAdmissible
  impl_note: 'Meta description: EBAdmissible (r.toRxn?.isSome = true) and TNet.inTEB are parallel case
    tables; the admissibility theorems follow by case analysis and are statements about syntax only.'
  required: false
  status: informal
  notes: Scope statement for the admissibility claims.
