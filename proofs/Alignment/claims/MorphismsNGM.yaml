- id: MorphismsNGM.spectrumFinTwo
  group: MorphismsNGM
  source:
    file: NetworkEpi/Morphisms/NGM.lean
    lines: 182-183
  text: 'The real spectrum of a 2 × 2 matrix with non-negative discriminant `D = (a − d)² + 4bc`: the
    two roots `(a + d ± √D)/2` of `λ² − (a + d)λ + (ad − bc)`.'
  kind: algebraic-identity
  impl:
  - NEP.spectrum_fin_two
  supporting: []
  impl_note: 0 ≤ (a − d)^2 + 4bc → spectrum ℝ !![a, b; c, d] = {(a + d + √D)/2, (a + d − √D)/2}. The characteristic
    polynomial is not stated.
  required: true
  status: implemented
  notes: ''
- id: MorphismsNGM.spectralRadiusFinTwoEqTraceIff
  group: MorphismsNGM
  source:
