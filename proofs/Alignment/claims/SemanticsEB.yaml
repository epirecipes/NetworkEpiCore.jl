- id: SemanticsEB.hasDerivWithinAtEdgeDefectLift
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 594-598
  text: '**Edge balance along EB solutions, with removals.** Let `x` solve the EB field of a T_EB reaction
    list `rs` within a set of times `I` at the time `t` (`HasDerivWithinAt`), and let `ψ''''` be the derivative
    of `ψ''` at `θ(t)`. Then, within `I` at `t`, `d/dt (θ − φ_S − Σ_X φ_X) = Σ_{(X → ∅, a) ∈ rs} a φ_X`.
    Removals `X → ∅` make the partner inert: its edges keep `θ` but leave every φ class, so the defect
    grows.'
  kind: dynamical
  impl:
  - NEP.hasDerivWithinAt_edgeDefect_lift
  supporting: []
  impl_note: 'HasDerivAt N.ψ'' (N.ψ'''' (x t).1) (x t).1 → HasDerivWithinAt x (lift N q rs (x t)) I t
    → HasDerivWithinAt (fun t => edgeDefect N q (x t)) (removalFlux rs (x t).2.2.1) I t, where edgeDefect
    = θ − φ_S − Σ_X φ_X. ''so the defect grows'' needs a·φ_X ≥ 0, which is not assumed: only the rate
    is stated.'
  required: true
  status: implemented
  notes: Cited by DESIGN §J.2 ('Without the sink, ... give the defect rates').
- id: SemanticsEB.hasDerivWithinAtNodeTotalLift
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 606-609
  text: '**Node balance along EB solutions, with removals.** Let `x` solve the EB field of a T_EB reaction
    list `rs` within a set of times `I` at the time `t`, and let `ψ''` be the derivative of `ψ` at `θ(t)`.
    Then, within `I` at `t`, `d/dt (S + Σ_X pop_X) = −Σ_{(X → ∅, a) ∈ rs} a pop_X`, where `S = qξψ(θ)`.'
  kind: dynamical
  impl:
  - NEP.hasDerivWithinAt_nodeTotal_lift
  supporting: []
  impl_note: HasDerivAt N.ψ (N.ψ' (x t).1) (x t).1 → HasDerivWithinAt x (lift N q rs (x t)) I t → HasDerivWithinAt
    (fun t => nodeTotal N q (x t)) (−removalFlux rs (x t).2.2.2) I t, nodeTotal = qξψ(θ) + Σ_X pop_X.
  required: true
  status: implemented
  notes: Cited by DESIGN §J.2.
