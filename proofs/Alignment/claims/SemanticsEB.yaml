- id: SemanticsEB.header.coordinates
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 19-25
  text: 'One susceptible species `s` (implicit) on an untyped, single-layer configuration network with
    degree PGF ψ. The state `u : EB σ` is `(θ, ξ, φ, pop)`: * `θ`: the probability that a random edge
    has not transmitted to the test node; * `ξ`: the exit survival factor (ξ ≡ 1 if there are no exits);
    * `φ X` (for node species `X : σ`): the probability that a random edge has not transmitted and its
    partner is in `X`; * `pop X`: the fraction of nodes in `X`.'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: EB σ := ℝ × ℝ × (σ → ℝ) × (σ → ℝ) = (θ, ξ, φ, pop); the probabilistic readings
    of the coordinates are interpretation, not formalised.'
  required: false
  status: informal
  notes: Definitional.
- id: SemanticsEB.header.observables
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 27-29
  text: The seed factor `q = 1 − Σ_X ρ_X` is a parameter. The susceptible observables are `S = qξψ(θ)`
    (`CNet.susc`) and `φ_S = qξψ'(θ)/ψ'(1)` (`CNet.phiS`). The design's cumulative incidence accumulator
    `cum` is not a state variable here.
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: CNet.susc N q θ ξ = qξψ(θ), CNet.phiS N q θ ξ = qξψ''(θ)/ψ''(1); q is a free
    real parameter (the relation q = 1 − Σρ is not imposed).'
  required: false
  status: informal
  notes: Definitional.
- id: SemanticsEB.header.fieldTable
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 34-41,44-45
  text: |-
    contact r = (s + J → X + J, τ_r): θ̇ += −τ_r φ_J
    φ̇_J += −τ_r φ_J
    φ̇_X += +τ_r φ_J · qξ ψ''(θ)/ψ'(1)
    pop_X' += +τ_r φ_J · qξ ψ'(θ)
    transition t = (X → Y | ∅, a): φ̇_X −= a φ_X; φ̇_Y += a φ_X; pop_X' −= a pop_X; pop_Y' += a pop_X
    (Y = ∅: no gains)
    exit e = (s → Y, ν_e): ξ̇ += −ν_e ξ; φ̇_Y += ν_e φ_S; pop_Y' += ν_e S
    initial condition: θ(0) = 1, ξ(0) = 1, φ_X(0) = pop_X(0) = ρ_X
    [...]
    `ebField N q r u` is exactly this contribution of reaction `r` at state `u`, and `lift N q rs u` is the sum of the contributions of the reactions in the list `rs`.
  kind: structural
  impl:
  - NEP.ebField_contact_table
  - NEP.ebField_exit_eq
  - NEP.ebField_remove_table
  - NEP.ebField_progress_table
  - NEP.lift_eq_sum
  supporting:
  - NEP.ebField_contact_eq
  - NEP.ebField_remove_eq
  - NEP.ebField_progress_eq
  impl_note: 'The four lemmas (module NetworkEpi.Semantics.Solutions) restate ebField N q r for r = contact
    J X τ, exit Y ν, trans X none a, trans X (some Y) a as explicit functions of u = (θ, ξ, φ, pop) built
    from Pi.single (contact: (−τφ_J, 0, single X (τφ_J·qξψ''''(θ)/ψ''(1)) − single J (τφ_J), single X
    (τφ_J·qξψ''(θ))); exit: (0, −νξ, single Y (ν·qξψ''(θ)/ψ''(1)), single Y (ν·qξψ(θ))); removal: (0,
    0, −single X (aφ_X), −single X (a pop_X)); progression: gains at Y minus losses at X). The ''+=''
    updates of the table are read as summands (with X = J both terms land on the same coordinate). NOT
    IN IMPL: the initial-condition row (θ(0) = 1, ξ(0) = 1, φ_X(0) = pop_X(0) = ρ_X: no Lean object) and
    ''lift N q rs u is the sum of the contributions'' (the definition of lift, no theorem).'
  required: true
  status: implemented
  notes: 'The design''s §D.4 table; ψ'', ψ'''' are fields of CNet, not derivatives of ψ (no hypothesis relates them in these lemmas). Remediation (SA-PASS triage): re-registered to the theorem that states the text''s form: the *_table theorems state the table rows in the table''s normal form (single Y b − single X b etc.), lift_eq_sum states that lift is the sum of the per-reaction fields. WEAK: the *_table forms were written after the shadows.'
- id: SemanticsEB.header.solutionsOnInterval
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 250-256
  text: '**Solutions on a time interval.** The results below are stated for a solution on a *time interval*:
    a convex set `I ⊆ ℝ` of times with `0 ∈ I`, such as `(a, b)` with `a < 0 < b`, `[0, T)`, `[0, ∞)`
    or `ℝ`. A curve `x : ℝ → EB σ` *solves the EB model of `rs` on `I`* if `HasDerivWithinAt x (lift N
    q rs (x t)) I t` for every `t ∈ I`. At an end point of `I` that lies in `I` (for example `t = 0` for
    `I = [0, T)`) this is a one-sided derivative. A curve with `HasDerivAt x (lift N q rs (x t)) t` at
    every `t ∈ I` satisfies it (`HasDerivAt.hasDerivWithinAt`). Only the values of `x` on `I` matter.'
  kind: dynamical
  impl: []
  supporting: []
  impl_note: Definition of 'solves on I' used as a hypothesis by conservation, node_conservation, xi_const
    (convex I ∋ 0). 'A curve with HasDerivAt ... satisfies it' is Mathlib's HasDerivAt.hasDerivWithinAt;
    'only the values of x on I matter' is a property of HasDerivWithinAt, not restated.
  required: false
  status: informal
  notes: Definitional + Mathlib background.
