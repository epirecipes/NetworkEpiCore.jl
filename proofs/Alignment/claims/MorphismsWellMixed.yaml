    lines: '376-379,379-380,34-37'
  text: |-
    **The well-mixed unit on trajectories (M1).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M1): "EB_{WM(κ)}(P) on (θ; x) with S = q e^{κ(θ−1)} is conjugate to MA(c_κ P) [...]. With exits, (θ, ξ, x) ↦ (qξe^{κ(θ−1)}, x) is a quotient semiconjugacy"; §D.3: "semiconjugacies map solution curves to solution curves".
    [...]
    solutions are mapped: `(θ, ξ, x) ↦ (qξe^{κ(θ−1)}, x)` (exits allowed) and, for exit-free P, `(θ, x) ↦ (q e^{κ(θ−1)}, x)` map EB solutions to solutions of MA(c_κ P); for exit-free P, `κ ≠ 0` and `q > 0` the inverse maps MA solutions that stay in `S > 0` (which contains `S ∈ (0, q]`) back to solutions on `(θ; x)`.
