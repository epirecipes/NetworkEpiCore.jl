- id: MorphismsWellMixed.header.model
  group: MorphismsWellMixed
  source:
    file: NetworkEpi/Morphisms/WellMixed.lean
    lines: 15-23
  text: 'Contacts are fleeting, so a stub meets a uniformly random node: the edge probabilities `φ_X`
    of a configuration network are replaced by the node fractions `x_X`. The state is `(θ, ξ, x)` and
    the per-reaction field (`wmField`) is, with `S = qξe^{κ(θ−1)}`: ``` contact s + J → X + J (τ): θ̇
    += −τ x_J; x_X'' += κτ x_J S exit s → Y (ν): ξ̇ += −ν ξ; x_Y'' += ν S transition X → Y | ∅ (a): x_X''
    −= a x_X; x_Y'' += a x_X (no gain for ∅) ```'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: the state WM σ = ℝ × ℝ × (σ → ℝ) and the per-reaction field wmField κ q (summed
    by wmLift, bundled as wmSys); S = wmSusc κ q u = qξe^{κ(θ−1)}.'
  required: false
  status: informal
  notes: Module-header modelling prose and field table (the definition of the EB model on WellMixed(κ)).
    It matches the design's §C.3 row quoted in the wellmixedUnitSemiconj claim.
- id: MorphismsWellMixed.wellmixedUnitSemiconj
  group: MorphismsWellMixed
  source:
    file: NetworkEpi/Morphisms/WellMixed.lean
    lines: '143-147,27-28'
  text: |-
    **The well-mixed unit as a semiconjugacy, with or without exits (M1).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M1): "With exits, (θ, ξ, x) ↦ (qξe^{κ(θ−1)}, x) is a quotient semiconjugacy"; §C.3, `WellMixed(κ)`: "(θ, ξ; x_X): θ̇ = −Σ_r τ_r x_{J_r}, S = qξe^{κ(θ−1)}, x_X gains κτ_r x_{J_r}S; conjugate to MA(c_κ P) (M1)".
    [...]
    for every T_EB model (exits allowed) and all κ, q, `(θ, ξ, x) ↦ (qξe^{κ(θ−1)}, x)` is a global semiconjugacy onto MA(c_κ P);
  kind: dynamical
  impl:
  - NEP.wellmixed_unit_semiconj
  supporting: []
  impl_note: '∀ finite σ (DecidableEq), κ q, rs : List (Rxn σ) (exits allowed): IsSemiconj (wmSys κ q
    rs) (maSys (wmTarget κ rs)) (wmMap κ q), wmMap κ q (θ, ξ, x) = (qξe^{κ(θ−1)}, x), wmTarget κ rs =
    c_κ rs as NRxn. No hypothesis on κ, q. "quotient" (surjective submersion) is wellmixed_unit_quotient,
    and the §C.3 "conjugate to MA(c_κ P)" is the exit-free wellmixed_unit (both separate claims). "onto"
    in the header is not a surjectivity statement here.'
  required: true
  status: implemented
  notes: ''
