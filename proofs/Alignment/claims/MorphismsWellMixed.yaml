  text: |-
    **The half-space θ ≤ 1 corresponds to S ∈ (0, q] (M1).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M1): "EB_{WM(κ)}(P) on (θ; x) with S = q e^{κ(θ−1)} is conjugate to MA(c_κ P) on S ∈ (0, q]".
    [...]
    for `κ > 0` the half-space `θ ≤ 1` corresponds to `S ∈ (0, q]`
  kind: equivalence
  impl:
  - NEP.wellmixed_unit_Iic_image
  - NEP.wellmixed_unit_Iic_preimage
  supporting:
  - NEP.wellmixed_unit_Iic
  impl_note: 0 < κ → 0 < q → ∀ w, 0 < (wmMap1 κ q w).1 ∧ ((wmMap1 κ q w).1 ≤ q ↔ w.1 ≤ 1). That every
    S ∈ (0, q] is hit is not stated here (it follows from the inverse in wellmixed_unit). The conjugacy
    itself is not part of this impl.
  required: true
  status: implemented
  notes: "Remediation (SA-PASS triage): new trusted theorem in the text's form: wellmixed_unit_Iic_image is the set correspondence wmMap1 '' {θ ≤ 1} = {S ∈ (0, q]} (κ, q > 0). Round-4 remediation (non-blind owner, 2026-09-28): forward 3 failed (the preimage direction was not stated). New trusted theorem wellmixed_unit_Iic_preimage (preimage of {S ∈ (0, q]} is {θ ≤ 1}) added to the impl and to CITABLE. Impl changed: checker update needed."
- id: MorphismsWellMixed.wellmixedUnitSolution
