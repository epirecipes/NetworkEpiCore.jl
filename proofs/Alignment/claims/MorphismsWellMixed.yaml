  impl:
  - NEP.wellmixed_unit_solution_at
  - NEP.wellmixed_unit1_solution_at
  - NEP.wellmixed_unit_inv_solution_at
  - NEP.wellmixed_unit_solution
  - NEP.wellmixed_unit1_solution
  - NEP.wellmixed_unit_inv_solution
  supporting: []
  impl_note: 'wellmixed_unit_solution_at: finite σ, any rs (exits allowed), any κ q, any I; HasDerivAt x (wmLift κ q rs (x t)) t on I → HasDerivAt (wmMap κ q ∘ x) (maLift (wmTarget κ rs) (wmMap κ q (x t))) t on I. wellmixed_unit1_solution_at: exit-free rs, the same for wmSys1 solutions w and wmMap1. wellmixed_unit_inv_solution_at: exit-free, κ ≠ 0, q > 0, v an MA(c_κ rs) solution (HasDerivAt) with 0 < (v t).1 on I → wmInv κ q ∘ v solves wmSys1 (HasDerivAt) on I. wellmixed_unit_solution: the within-I version of the first.'
  required: true
  status: implemented
  notes: "Remediation: spec clarification (the header bullet now spells out which maps and directions; the ambiguity 'solutions are mapped' is resolved as: both maps forward and the inverse backward); three new theorems. Text changed: re-shadow blind. Round-4 remediation (non-blind owner, 2026-09-28): forward 5 and 6 failed (no within-I versions of the exit-free map and of the inverse). New trusted theorems wellmixed_unit1_solution and wellmixed_unit_inv_solution (within I) added to the impl and to CITABLE. Impl changed: checker update needed."
