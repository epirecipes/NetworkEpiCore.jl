- id: MorphismsWellMixed.wellmixedUnit
  group: MorphismsWellMixed
  source:
    file: NetworkEpi/Morphisms/WellMixed.lean
    lines: '257-260,261,30-31'
  text: |-
    **The well-mixed unit (M1): a conjugacy for exit-free models.** Design statement (DESIGN_NetworkEpiCore.md §D.5, M1): "Well-mixed unit | EB_{WM(κ)}(P) on (θ; x) with S = q e^{κ(θ−1)} is conjugate to MA(c_κ P) on S ∈ (0, q], for every exit-free T_EB model P [...] | natural iso (quotient with exits)".
    [...]
    for exit-free P, `κ ≠ 0` and `q > 0`, the model on `(θ; x)` is conjugate to MA(c_κ P) restricted to `S > 0` (inverse `(S, x) ↦ (1 + log(S/q)/κ, x)`)
  kind: categorical
  impl:
  - NEP.wellmixed_unit
  supporting: []
  impl_note: 'κ ≠ 0 → 0 < q → (∀ r ∈ rs, r.isExit = false) → IsConjOn (wmSys1 κ q rs) (maSys (wmTarget
    κ rs)) Set.univ {v | 0 < v.1} (wmMap1 κ q) (wmInv κ q), wmMap1 (θ, x) = (q e^{κ(θ−1)}, x), wmInv (S,
    x) = (1 + log(S/q)/κ, x). Differences from the design statement: the MA side is restricted to the
    open set {S > 0}, not "S ∈ (0, q]" (the half-space θ ≤ 1 ↔ S ≤ q is wellmixed_unit_Iic, separate);
    "natural iso" — naturality in P is not formalised (docstring Scope; see MorphismsWellMixed.wellmixedUnitNaturality);
    "conjugate" is IsConjOn (see MorphismsCommon.isConjOn). κ ≠ 0 and q > 0 are in the header, not in
    the design statement.'
  required: true
  status: implemented
  notes: ''
