  - NEP.eb_to_pws_pt_closure_one
  supporting:
  - NEP.eb_to_pws_pt
  impl_note: 'q ≠ 0; Θ convex with nonempty interior; on Θ: HasDerivAt relations for ψ, ψ'', ψ > 0, ψ''
    ≠ 0, and PT: ψ'' θ = α ψ θ ^ κ (real power). Conclusion as eb_to_pws_const with that κ: IsSemiconjOn
    (ebSys N q rs) (pwSSys κ rs) (pwsDomain N Θ) (fun u => (pwImage N q u).2). "K = closure_constant(d)"
