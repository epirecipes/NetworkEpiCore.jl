- id: MorphismsPairwise.pwsEbField
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 156-158
  text: '**Per-reaction identity behind M6.** At a state with `ψ(θ) ≠ 0`, `ψ''(θ) ≠ 0` and `qξ ≠ 0`, the
    derivative of π^PW carries the EB field of each T_EB reaction `r` to the PGF-closure field of `r`
    at the image point.'
  kind: algebraic-identity
  impl:
  - NEP.pws_ebField_of_mul
  supporting:
  - NEP.pws_ebField
  impl_note: ψ(θ) ≠ 0 → ψ'(θ) ≠ 0 → q ≠ 0 → ξ ≠ 0 → pwD N q u (ebField N q r u) = pgfField N r (pwImage
    N q u) (the text's "qξ ≠ 0" is split into q ≠ 0 and ξ ≠ 0, equivalent). "The derivative" is pwD. No
    derivative relations are needed for this identity.
  required: true
  status: implemented
  notes: 'Remediation (SA-PASS triage): new trusted theorem in the text''s form: pws_ebField_of_mul takes the text''s hypothesis qξ ≠ 0 (form only).'
