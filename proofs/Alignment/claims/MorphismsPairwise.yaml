- id: MorphismsPairwise.ebToPwsConst
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 325-329,337-337,33-34
  text: |-
    **The constant-closure pairwise model is exact when K_ψ is constant (M6 with M8).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M8): "So NBM's constant closure ⟨k(k−1)⟩/⟨k⟩² is exact **iff** the degree distribution is PT"; M6: "onto PW^S with closure [Z s J] = K_ψ(θ)[Zs][sJ]/[s], K_ψ = ψψ''/ψ'²".
    [...]
    this is the "if" direction of the design's "exact iff PT"
    [...]
    if `K_ψ ≡ κ` on Θ, the PW^S part alone, with the **constant** closure κ, is the image of EB: the constant-closure pairwise model is exact.
  kind: dynamical
  impl:
  - NEP.eb_to_pws_const
  supporting: []
  impl_note: Hypotheses of eb_to_pws plus ∀ θ ∈ Θ, N.closureK θ = κ (K_ψ ≡ κ on Θ); conclusion IsSemiconjOn
    (ebSys N q rs) (pwSSys κ rs) (pwsDomain N Θ) (fun u => (pwImage N q u).2) (π^PW without θ). The hypothesis
    is "K_ψ constant", not "PT" (PT → K_ψ constant is pt_iff_closureK, used by eb_to_pws_pt). Only the
    "if" direction of the design's "exact iff PT" (the "only if" is MorphismsPairwise.constClosureOnlyIf,
    missing). "Exact" is this semiconjugacy; trajectories are not restated. Same domain differences as
    ebToPws.
  required: true
  status: implemented
  notes: ''
