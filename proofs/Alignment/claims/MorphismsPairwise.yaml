# SA-PASS claim registry fragment: group MorphismsPairwise
# Source: NetworkEpi/Morphisms/Pairwise.lean  (paths relative to proofs/)
# Registrar: claim registrar 2/2 (non-blind), WP4-style SA-PASS on the NetworkEpi library.
#
# Conventions
#   id       <Group>.<lowerCamelTheoremName> for a theorem docstring; <Group>.header.<slug> for
#            module-header prose; <Group>.<slug> for a gap or remark stated in a docstring.
#   text     VERBATIM (whitespace-normalised) quote of the cited lines; non-adjacent fragments are
#            separated by a line '[...]'. Lean comment delimiters are not part of the text.
#            For a citable theorem: the bold title and the "Design statement" paragraph, plus
#            natural-language claim sentences of the docstring that are not transcriptions of the
#            Lean statement (e.g. "No condition on ... is needed", a Scope sentence that names the
#            part of the design statement being claimed), plus the module-header "Results" bullet
#            for that theorem (without the leading theorem name). The "Lean statement:" paragraph
#            is never quoted (it transcribes the formal statement).
#   status   implemented -> impl lists trusted theorems; required: true
#            missing     -> checkable claim with no implementing theorem (coverage gap)
#            informal    -> definitional, interpretive or meta prose, or an index entry that
#                           restates a claim registered elsewhere (see notes)
#   Each CITABLE.txt name is the impl of exactly one required claim.
#   impl_note/notes describe the Lean statements: BLIND shadow authors must not read this file.
- id: MorphismsPairwise.header.target
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 17-23
  text: 'The state is `(θ, w)` with `w = ([s], [ss], [sZ], [Z]) : PWS σ`. The PW^S part is the per-reaction
    field `pwSField K` of `NetworkEpi.Semantics.PWS` (checked there against the design''s `check_pwS_general.py`
    and `check_exit_pws.py`), evaluated at the degree-dependent closure `K = K_ψ(θ) = ψ(θ)ψ''''(θ)/ψ''(θ)²`.
    The auxiliary θ evolves by `θ̇ = −(ψ(θ)/ψ''(θ)) Σ_contacts τ_r [s J_r]/[s]`. On the image of π^PW,
    `[s] = qξψ(θ)`, so this is the design''s `θ̇ = −Σ_r τ_r [s J_r]/(qξψ''(θ))` written in the coordinates
    of the target (ξ is not a coordinate of PW^S, so the target must not refer to it).'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: pgfSys N rs on PWSθ σ = ℝ × PWS σ with field pgfLift (per reaction pgfField
    = (pgfThetaField, pwSField (N.closureK θ) r)). "On the image of π^PW, [s] = qξψ(θ)" holds by definition
    of pwImage.'
  required: false
  status: informal
  notes: Module-header description of the target system.
- id: MorphismsPairwise.header.notFreeScalar
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 37-39
  text: '**Not** the free-scalar identity: the legacy "pointwise pairwise identity" (§D.7 "Never cited")
    is a statement about free scalars; here the derivatives of ψ enter only through the `HasDerivAt` hypotheses,
    and the statement is a semiconjugacy of vector fields.'
  kind: other
  impl: []
  supporting: []
  impl_note: 'Meta remark: the M6 theorems take HasDerivAt hypotheses on ψ, ψ'', ψ'''' and state IsSemiconjOn
    of vector fields.'
  required: false
  status: informal
  notes: Refers to §D.7 "Never cited" (the pointwise pairwise identity).
- id: MorphismsPairwise.ebToPws
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 224-232,251-251,27-30
  text: |-
    **EB → S-anchored pairwise with the PGF closure, for every ψ and every T_EB model (M6).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M6): "**EB → S-anchored pairwise** | π^PW(θ, ξ, φ, pop) = (θ, [s] = qξψ(θ), [sX] = qξψ'(θ)φ_X, [ss] = q²ξ²ψ'(θ)²/ψ'(1), [X] = pop_X) onto PW^S with closure [Z s J] = K_ψ(θ)[Zs][sJ]/[s], K_ψ = ψψ''/ψ'². It holds **for every C² ψ and every T_EB model**, on U = {ψ ≠ 0, ψ' ≠ 0} (the DSA closure, Kiss, Kenah & Rempała 2023) | natural semiconjugacy"; §A.4: "`PGFClosure()`: the S-anchored subsystem with closure K_ψ(θ) = ψ(θ)ψ''(θ)/ψ'(θ)² and an auxiliary θ, where θ̇ = −Σ_r τ_r [s J_r]/(qξψ'(θ)). It is exact against EB for every ψ (M6)".
    [...]
    No condition on ψ'(1) is needed.
    [...]
    for every T_EB reaction list (contacts, exits, progressions, removals), every configuration network and every set Θ of θ values at which ψ' and ψ'' are the derivatives of ψ and ψ', π^PW is a local semiconjugacy from EB to `pgfSys` on `U = {θ ∈ Θ, ψ(θ) ≠ 0, ψ'(θ) ≠ 0, ξ ≠ 0}` (for `q ≠ 0`).
  kind: dynamical
  impl:
  - NEP.eb_to_pws
  supporting: []
  impl_note: '∀ finite σ (DecidableEq) N q, q ≠ 0 → ∀ Θ, (∀ θ ∈ Θ, HasDerivAt N.ψ (N.ψ'' θ) θ) → (∀ θ
    ∈ Θ, HasDerivAt N.ψ'' (N.ψ'''' θ) θ) → ∀ rs, IsSemiconjOn (ebSys N q rs) (pgfSys N rs) (pwsDomain
    N Θ) (pwImage N q), pwsDomain N Θ = {u | u.1 ∈ Θ ∧ ψ u.1 ≠ 0 ∧ ψ'' u.1 ≠ 0 ∧ u.2.1 ≠ 0}. Differences
    from the design statement: its U = {ψ ≠ 0, ψ'' ≠ 0} lacks ξ ≠ 0, and q ≠ 0 is an extra hypothesis
    (both are in the header fragment; DESIGN §L.3 amends U to {ψ ≠ 0, ψ'' ≠ 0, ξ ≠ 0} with q ≠ 0); "every
    C² ψ" is replaced by the two derivative relations on Θ (weaker, so C² ψ with Θ = ℝ is covered). "natural"
    (in P) is not formalised. The PGFClosure θ-equation is stated in target coordinates, θ̇ = −(ψ/ψ'')Σ_contacts
    τ[sJ]/[s], which equals the design''s −Σ τ[sJ]/(qξψ'') on the image of π^PW. "exact against EB" =
    this semiconjugacy (trajectories: eb_to_pws_solution).'
  required: true
  status: implemented
  notes: ''
- id: MorphismsPairwise.ebToPwsSolution
  group: MorphismsPairwise
  source:
    file: NetworkEpi/Morphisms/Pairwise.lean
    lines: 262-267,31-31
  text: |-
    **EB → PW^S on trajectories (M6).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M6): "π^PW(θ, ξ, φ, pop) = (θ, [s] = qξψ(θ), [sX] = qξψ'(θ)φ_X, [ss] = q²ξ²ψ'(θ)²/ψ'(1), [X] = pop_X) onto PW^S with closure [Z s J] = K_ψ(θ)[Zs][sJ]/[s], K_ψ = ψψ''/ψ'². It holds **for every C² ψ and every T_EB model**, on U = {ψ ≠ 0, ψ' ≠ 0}"; §D.3: "solutions that stay in U are mapped".
    [...]
    EB solutions that stay in `U` map to PGF-closure solutions.
  kind: dynamical
  impl:
  - NEP.eb_to_pws_solution_at_global
  - NEP.eb_to_pws_solution_global
  supporting:
  - NEP.eb_to_pws_solution_at
  - NEP.eb_to_pws_solution
  impl_note: 'Hypotheses of eb_to_pws, plus a HasDerivWithinAt solution x of lift N q rs on any I ⊆ ℝ
    with x t ∈ pwsDomain N Θ for t ∈ I; conclusion: t ↦ pwImage N q (x t) solves pgfLift N rs within I.
    The design''s U lacks ξ ≠ 0 (see ebToPws).'
  required: true
  status: implemented
  notes: "Remediation (SA-PASS triage): new trusted theorem in the text's form: eb_to_pws_solution_at (two-sided HasDerivAt at every t ∈ I, any I) added; both solution notions are now covered. Round-4 remediation (non-blind owner, 2026-09-28): backward failed because the Θ-local impls are more general than the text (\"for every C² ψ\"). New exact-statement theorems eb_to_pws_solution_at_global / eb_to_pws_solution_global (ψ C² at every real θ, U = {ψ ≠ 0, ψ' ≠ 0, ξ ≠ 0}) are the impl; the Θ-local ones are supporting. CITABLE: eb_to_pws_solution{,_at} replaced by the _global names. Impl changed: checker update needed."
