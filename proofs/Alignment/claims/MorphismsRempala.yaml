- id: MorphismsRempala.rempalaEbField
  group: MorphismsRempala
  source:
    file: NetworkEpi/Morphisms/Rempala.lean
    lines: 104-106
  text: '**Per-reaction identity behind M3.** On the Poisson(μ) network with `μ ≠ 0`, the derivative of
    Rempała''s map carries the EB field of each T_EB reaction `r` to the mass-action field of `E_μ r`
    at the image point.'
  kind: algebraic-identity
  impl:
  - NEP.rempala_ebField
  supporting: []
  impl_note: 'μ ≠ 0 → rempalaD μ q u (ebField (CNet.poisson μ) q r u) = maLift (r.rempala μ) (rempalaMap
    μ q u) for every r : Rxn σ and u. "The derivative" is rempalaD.'
  required: true
  status: implemented
  notes: ''
