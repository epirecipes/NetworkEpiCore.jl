# Expected audit outcome for every EXAMPLE.* / SELFTEST.* claim (checked by
# `bash scripts/sa_pass.sh --self-test`). Every such claim registered in Lean must appear here,
# and every entry must match exactly: `flags` (set of registration inconsistencies), `forward`
# (statuses by shadow index), `backward`, and optionally `sa_pass`, `soft`, `shadow_question`,
# `offenders_include` (substrings that must occur in the offenders of a check), `hints` (exact set
# of unscored hints), `flag_details_include` / `flag_details_exclude` (substrings of a flag's
# details), `trusted_free` (review status of each content-free shadow, by index),
# `unused_shadows` (backward check), and bridge and refuter statuses.
claims:
  # --- worked example: must pass ---------------------------------------------------------------
  # admissibleType needs the reviewed bridge TNet.inTEB t = true ↔ t ∈ {contact, exit, progress, remove}
  EXAMPLE.admissibleType:
    {flags: [], forward: [pass, pass], backward: pass, sa_pass: 1, soft: 1.0, hints: [],
     unused_shadows: [], trusted_free: {}}
  EXAMPLE.notAdmissible:
    {flags: [], forward: [pass, pass], backward: pass, sa_pass: 1, soft: 1.0, hints: [],
     unused_shadows: [], trusted_free: {}}
  # the shared hypothesis r.EBAdmissible has an @[sa_witness] certificate, so no witness_missing hint
  EXAMPLE.roundTrip:
    {flags: [], forward: [pass], backward: pass, sa_pass: 1, soft: 1.0, hints: [], trusted_free: {}}

  # --- vacuity guard ---------------------------------------------------------------------------
  SELFTEST.vacuousIgnore:   {flags: [], forward: [vacuous], backward: missing, sa_pass: 0, soft: 0.0}
  SELFTEST.vacuousBeta:     {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousAndLeft:  {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousAuxLemma: {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousEval:     {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousConst:    {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousMatch:    {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousExistsElim: {flags: [], forward: [vacuous], backward: missing}
  SELFTEST.vacuousDataArg:  {flags: [], forward: [vacuous], backward: missing}
  # deep destructuring of a large hypothesis, parts ignored (normaliser memo table)
  SELFTEST.vacuousNestedObtain: {flags: [], forward: [vacuous], backward: missing}

  # --- structural rule -------------------------------------------------------------------------
  SELFTEST.automationSimp:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [of_eq_true]}}
  SELFTEST.automationRing:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [Mathlib.Tactic.Ring]}}
  SELFTEST.automationOmega:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: ["Int."]}}
  SELFTEST.helperAutomation:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [Mathlib.Tactic.Ring]}}
  SELFTEST.proofField:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [NEP.Semiconj.diff]}}
  SELFTEST.decideCheck:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [of_decide_eq_true]}}
  SELFTEST.implInBackward:
    {flags: [], forward: [missing], backward: audit_violation,
     offenders_include: {backward: ["NEP.NRxn.exists_not_ebAdmissible [implementation theorem"]}}

  # --- bridges ---------------------------------------------------------------------------------
  SELFTEST.unreviewedBridge:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [unreviewed bridge]}}
  SELFTEST.staleBridge:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [stale bridge]}}
  SELFTEST.launderingBridge:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [invalid bridge]}}
  SELFTEST.rejectedBridge:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [rejected bridge]}}
  SELFTEST.forgedReview:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [unreviewed bridge]}}
  SELFTEST.outOfScopeBridge:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [bridge registered for another claim]}}
  SELFTEST.invalidBridges:
    {flags: [], forward: [audit_violation], backward: missing,
     offenders_include: {forward1: [invalid bridge]}}

  # --- statements, sorry, missing checks, recorded failures ------------------------------------
  SELFTEST.mismatch:          {flags: [], forward: [fail], backward: missing}
  SELFTEST.sorryCheck:        {flags: [], forward: [sorry], backward: missing}
  SELFTEST.missingCheck:
    {flags: [], forward: [pass, missing], backward: pass, sa_pass: 0, soft: 0.75}
  SELFTEST.incompleteShadows:
    {flags: [incomplete], forward: [pass], backward: pass, sa_pass: 0, soft: 0.0}
  SELFTEST.recordedFail:
    {flags: [], forward: [fail], backward: missing, shadow_question: [1]}

  # --- registration consistency ----------------------------------------------------------------
  SELFTEST.implUntrusted:     {flags: [impl_untrusted], forward: [missing], backward: missing}
  SELFTEST.implUnsound:       {flags: [impl_unsound, impl_untrusted], forward: [missing], backward: missing}
  SELFTEST.gap:               {flags: [gap], forward: [missing], backward: missing}
  SELFTEST.duplicate:         {flags: [duplicate], forward: [missing], backward: missing}
  "SELFTEST.bad id!":         {flags: [invalid_id], forward: [missing], backward: missing}
  SELFTEST.unlisted:          {flags: [unlisted], forward: [missing], backward: missing}
  SELFTEST.textMismatch:      {flags: [text_mismatch], forward: [missing], backward: missing}
  SELFTEST.groupMismatch:     {flags: [group_mismatch], forward: [missing], backward: missing}
  SELFTEST.requiredMismatch:  {flags: [required_mismatch], forward: [missing], backward: missing}
  SELFTEST.implMismatch:      {flags: [impl_mismatch], forward: [missing], backward: missing}
  SELFTEST.shadowReuse:       {flags: [shadow_mismatch], forward: [missing, missing], backward: missing}

  # --- content-free shadows (spot-check bypass 1: ClosureTheorem.table.R59) -------------------
  SELFTEST.trustedFreeShadow:
    {flags: [shadow_trusted_free], forward: [pass], backward: pass, sa_pass: 0, soft: 0.0,
     trusted_free: {1: unreviewed}}
  SELFTEST.trustedFreeReviewed:
    {flags: [], forward: [pass], backward: pass, sa_pass: 1, soft: 1.0, trusted_free: {1: reviewed}}
  SELFTEST.trustedFreeStale:
    {flags: [shadow_trusted_free], forward: [pass], backward: pass, sa_pass: 0,
     trusted_free: {1: stale}}

  # --- satisfiability witnesses (spot-check bypass 2: Docs.ms.T5-rateTwo) --------------------
  # SELFTEST.refutedHypothesis is not ported (NetworkEpi has no theorem with an unsatisfiable
  # hypothesis); witnessMissing is the no-false-positive control: valid refuters headed by
  # NRxn.EBAdmissible are in scope, yet its satisfiable hypothesis must not be flagged.
  SELFTEST.witnessMissing:
    {flags: [], forward: [pass], backward: pass, sa_pass: 1, hints: [witness_missing]}
  SELFTEST.witnessInvalid:
    {flags: [witness_invalid], forward: [pass], backward: pass, sa_pass: 0}

  # --- vacuous backward checks (spot-check bypass 3: MDG.fibreCollapseObstruction) ------------
  SELFTEST.backwardVacuous:
    {flags: [], forward: [pass], backward: vacuous, sa_pass: 0, soft: 0.5, unused_shadows: [1]}
  SELFTEST.backwardVacuousEval:
    {flags: [], forward: [pass], backward: vacuous, sa_pass: 0, soft: 0.5}

bridges:
  Alignment.Example.AdmissibleType.bridge_inTEB: reviewed
  Alignment.Example.SelfTest.UnreviewedBridge.bridge: unreviewed
  Alignment.Example.SelfTest.ForgedReview.bridge: unreviewed
  Alignment.Example.SelfTest.StaleBridge.bridge: stale
  Alignment.Example.SelfTest.RejectedBridge.bridge: rejected
  Alignment.Example.SelfTest.LaunderingBridge.bridge: invalid
  Alignment.Example.SelfTest.InvalidBridges.closedConj: invalid
  Alignment.Example.SelfTest.InvalidBridges.natHead: invalid
  Alignment.Example.SelfTest.InvalidBridges.closedRhs: invalid

refuters:
  NEP.NRxn.not_ebAdmissible_resus: valid
  NEP.NRxn.not_ebAdmissible_nodeContact: valid
  Alignment.Example.SelfTest.AlignmentRefuter.refuter: valid
  Alignment.Example.SelfTest.AlignmentRefuter.unsoundRefuter: invalid
  Alignment.Example.SelfTest.AlignmentRefuter.notARefuter: invalid
