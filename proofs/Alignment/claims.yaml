- id: SemanticsEB.liftAppend
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 111-118,186-189,207-212,229-233
  text: |-
    **H1, part 1: the EB lift is additive in the reaction list.** Design statement (DESIGN_NetworkEpiCore.md §D.4, table row EB_N, column "Strict under gluing?"): "**yes**: the per-reaction lift is additive and natural in species maps ([L] `lift_append`, `lift_map`)"; §D.6: "**H1** EB(glue(A,B)) = glue(EB A, EB B), for fixed N with s glued to s | **yes, strict** | local per-reaction fields | [L] `lift_append`, `lift_map` (contact/transition; the exit case is added in WP13)".
    [...]
    **Naturality of the per-reaction EB field in species maps.** Design statement (DESIGN_NetworkEpiCore.md §D.7, L3): "`lift_append`, `ebField_map`, `lift_map` (relabelling/gluing naturality with pushforward along fibres)".
    [...]
    **H1, part 2: the EB lift is natural in species maps (relabelling and gluing).** Design statement (DESIGN_NetworkEpiCore.md §D.4, row EB_N): "the per-reaction lift is additive and natural in species maps ([L] `lift_append`, `lift_map`)"; §D.7, L3: "`lift_map` (relabelling/gluing naturality with pushforward along fibres)"; §D.6 H1 (quoted at `lift_append`), with the exit case included.
    [...]
    **H1: the EB lift is strict under gluing.** Design statement (DESIGN_NetworkEpiCore.md §D.6): "**H1** EB(glue(A,B)) = glue(EB A, EB B), for fixed N with s glued to s | **yes, strict** | local per-reaction fields"; §D.3 (open systems): "composition identifies ported coordinates and **adds** vector fields".
  kind: categorical
  impl:
  - NEP.lift_append
  - NEP.ebField_map
  - NEP.lift_map
  - NEP.lift_glue
  supporting: []
  impl_note: 'lift_append: for all N (ψ, ψ'', ψ'''' arbitrary functions), q, rs rs'' : List (Rxn σ), u
    : EB σ: lift N q (rs ++ rs'') u = lift N q rs u + lift N q rs'' u. ebField_map: for σ finite, f :
    σ → σ'', r : Rxn σ, u : EB σ'': ebField N q (r.map f) u = pushEB f (ebField N q r (pullEB f u)). lift_map:
    the same for lists: lift N q (rs.map (Rxn.map f)) u = pushEB f (lift N q rs (pullEB f u)). lift_glue:
    for a cospan f : σA → σ, g : σB → σ (σA, σB finite): lift N q (A.map (Rxn.map f) ++ B.map (Rxn.map
    g)) u = pushEB f (lift N q A (pullEB f u)) + pushEB g (lift N q B (pullEB g u)). pushEB keeps θ, ξ
    and sums φ, pop over the fibres of f; pullEB keeps θ, ξ and precomposes φ, pop with f. ''glue(A,B)''
    is modelled as relabelling along the cospan legs plus concatenation, and ''glue(EB A, EB B)'' as the
    sum of the pushed-forward component fields at pulled-back states; no open system / decorated cospan
    is formalised (''composition identifies ported coordinates and adds vector fields'' is read this way).
    ''Natural in species maps'' is the pushforward/pullback identity, not a natural transformation of
    functors. ''for fixed N with s glued to s'': one implicit susceptible species, shared. The exit case
    is included (ebField covers all Rxn constructors).'
  required: true
  status: implemented
  notes: 'Citable: NEP.lift_append, NEP.ebField_map, NEP.lift_map, NEP.lift_glue. Merged claim: their
    docstrings quote overlapping design statements (§D.4 row EB_N, §D.6 H1, §D.7 L3) that name each other.'
