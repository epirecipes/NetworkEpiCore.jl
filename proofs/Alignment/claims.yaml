  text: |-
    **Rempała's theorem for SIR as a semiconjugacy (M3, SIR case).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M3): "**Rempała quotient** ("back to mass action on the same species") | EB_{Pois μ}(P) → MA(E_μ P), E_μ P = c_μ P + {J_r → ∅ at τ_r} on the edge copies; π = (θ, φ, pop) ↦ (qξe^{μ(θ−1)}, φ). For SIR: MA(β = μτ, γ_MA = γ + τ). **The MA "I" is φ_I, not prevalence** | natural semiconjugacy (surjective submersion) | **[L]** `NEP.rempala` (SIR)".
    [...]
    The design's "surjective submersion" holds for `μ ≠ 0` and `q > 0`, onto the mass-action states with `S > 0` (`rempala_quotient_sir`); it fails for `μ = 0` or `q = 0`.
