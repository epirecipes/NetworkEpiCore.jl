  group: MorphismsRempala
  source:
    file: NetworkEpi/Morphisms/Rempala.lean
    lines: 134-140,151-152,27-30
  text: |-
    **Rempała's quotient for every T_EB model (M3, general P).** Design statement (DESIGN_NetworkEpiCore.md §D.5, M3): "**Rempała quotient** ("back to mass action on the same species") | EB_{Pois μ}(P) → MA(E_μ P), E_μ P = c_μ P + {J_r → ∅ at τ_r} on the edge copies; π = (θ, φ, pop) ↦ (qξe^{μ(θ−1)}, φ). For SIR: MA(β = μτ, γ_MA = γ + τ). **The MA "I" is φ_I, not prevalence** | natural semiconjugacy (surjective submersion)"; §J.10: "**Exits in D_μ** (§D.5 M2) are `s → Φ_Y + Y`; in E_μ they stay `S → V`."
    [...]
    the MA coordinate `x_X` is the EB edge probability `φ_X`, not the node fraction `pop_X`, which the map forgets.
    [...]
    for every T_EB reaction list `P` (contacts, exits, progressions, removals; any number of infectors and entry states) and every `μ ≠ 0`, `rempalaMap μ q` is a global semiconjugacy from the EB model of `P` on a Poisson(μ) configuration network to the mass-action model of `E_μ P`.
  kind: dynamical
  impl:
  - NEP.rempala_general
  supporting: []
  impl_note: '∀ finite σ (DecidableEq), μ q, μ ≠ 0 → ∀ rs : List (Rxn σ), IsSemiconj (ebSys (CNet.poisson
    μ) q rs) (maSys (rempalaRxns μ rs)) (rempalaMap μ q). Hypothesis μ ≠ 0 is not in the design statement
    (it is in the header bullet); q is arbitrary. The map is (θ, ξ, φ, pop) ↦ (qξe^{μ(θ−1)}, φ) (the design
