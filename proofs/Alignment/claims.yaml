- id: SyntaxRxn.ebAdmissibleIffType
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 153-169
  text: |-
    EB-admissibility is membership of the reaction's type in T_EB: "the sub-theory with no arrow into Sus" (DESIGN §B.2). Design statement (DESIGN_NetworkEpiCore.md §B.2): "**T_EB** = {contact, exit, progress, remove}: the sub-theory with **no arrow into Sus**. **T_net** = all eight types."
    [...]
    T_EB is the list {contact, exit, progress, remove}; the gloss "no arrow into Sus" does not characterise it in this syntax, since `nodeContact` (X + J → Y + J with X, Y ∉ Σ) has no arrow into Sus and is not in T_EB. `TNet` has six of the design's eight T_net types: `:sus_move` and `:sus_contact` need a second susceptible species or a susceptible product, which `NRxn` does not represent.
  kind: equivalence
  impl:
  - NEP.NRxn.ebAdmissible_iff_type
  supporting: []
  impl_note: '∀ σ (r : NRxn σ), r.EBAdmissible ↔ TNet.inTEB r.type = true, where inTEB is true exactly
    on contact, exit, progress, remove. NOT IN IMPL: ''T_net = all eight types'' (TNet has six constructors;
    SyntaxRxn.header.tebTnet). ''No arrow into Sus'' is the design''s gloss, not formalised; read literally
    on the Petri net (no output arc into s), a nodeContact X + J → Y + J with a node catalyst J has no
    arrow into Sus yet is neither in T_EB nor EB-admissible, so the theorem follows the enumerated set,
    not the gloss. EBAdmissible is defined as membership in the image of Rxn σ (r.toRxn?.isSome = true);
    the theorem is a case check that the two tables agree.'
  required: true
  status: implemented
  notes: 'Remediation (spot check): the quoted design text is only partly true of this syntax (''T_net
    = all eight types'' vs six TNet constructors; ''no arrow into Sus'' is not a characterisation because
    of nodeContact). Scope sentences added to the docstring and to this text (DESIGN §M.6). Text changed:
    re-sync sa_claim text; re-shadow blind if needed.'
