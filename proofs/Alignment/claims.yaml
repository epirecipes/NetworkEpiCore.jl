- id: SemanticsEB.conservation
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 703-709
  text: '**Edge conservation θ = φ_S + Σ_X φ_X is invariant along removal-free EB solutions.** Design
    statement (DESIGN_NetworkEpiCore.md §D.4, Evidence): "The exit terms were checked by hand. Conservation
    θ = φ_S + Σφ_X holds."; amended by §M.1: "For removal-free T_EB models (no `X → ∅`), θ = φ_S + Σφ_X
    is invariant along every solution on a time interval: if it holds at t = 0 it holds at every time
    of the interval. In particular, when ψ''(1) ≠ 0, it holds along solutions from the design''s initial
    condition θ(0) = ξ(0) = 1, Σφ_X(0) = 1 − q."'
  kind: dynamical
  impl:
  - NEP.conservation_invariant
  - NEP.conservation
  supporting: []
  impl_note: 'conservation_invariant: no hypothesis on ψ''(1); rs removal-free (isRemoval = false); I
    convex, 0 ∈ I; x solves the EB field within I at every t ∈ I; HasDerivAt ψ'' (ψ'''' θ(t)) θ(t) at
    visited θ; θ(0) = φ_S(0) + Σ_X φ_X(0) → ∀ t ∈ I, θ(t) = φ_S(t) + Σ_X φ_X(t) (φ_S = N.phiS q θ ξ =
    qξψ''(θ)/ψ''(1)). conservation: the same with ψ''(1) ≠ 0 and the design initial condition θ(0) = 1,
    ξ(0) = 1, Σ_X φ_X(0) = 1 − q in place of the relation at 0.'
  required: true
  status: implemented
  notes: 'Remediation: the unqualified design sentence ''Conservation θ = φ_S + Σφ_X holds'' is ambiguous
    (invariance vs the design IC) and false with removals; corrected by the amendment §M.1 (DESIGN_NetworkEpiCore.md
    §M), quoted in conservation_invariant''s docstring. Text re-cited from that docstring; impl [conservation_invariant,
    conservation] (invariance reading; design-IC reading under ψ''(1) ≠ 0). Text changed: re-shadow blind.'
