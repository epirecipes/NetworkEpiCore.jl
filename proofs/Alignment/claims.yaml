  text: '*Expanded*: the general per-reaction EB model of SIR (`s + I → I + I` at per-contact rate τ,
    `I → R` at γ) on a configuration network `N`, state `(θ, ξ, φ_I, φ_R, pop_I, pop_R)`. *Compact* (`compactSIR`;
    Miller 2011 with the explicit seed factor q, as in `EdgeBasedModels.jl`''s `_build_compact`): state
    `(θ, R)` with `θ̇ = −τθ + τqψ''(θ)/ψ''(1) + γ(1 − θ)` and `Ṙ = γ(1 − qψ(θ) − R)`; `S = qψ(θ)`, `I
    = 1 − S − R`.'
  kind: structural
  impl: []
  supporting: []
  impl_note: 'Definitional: the expanded model is ebSys N q (sirRxns τ γ); the compact model is compactSIR
    N q τ γ on ℝ × ℝ with F (θ, R) = (−τθ + τ·phiS q θ 1 + γ(1 − θ), γ(1 − susc q θ 1 − R)), i.e. θ̇ =
    −τθ + τqψ''(θ)/ψ''(1) + γ(1 − θ), Ṙ = γ(1 − qψ(θ) − R).'
  required: false
  status: informal
  notes: Module-header description of the two models (Miller 2011 with seed factor q).
