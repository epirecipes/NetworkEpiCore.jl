- id: SemanticsEB.nodeConservation
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 780-785
  text: '**Node conservation S + Σ_X pop_X = 1.** Let `N` be a configuration network with `ψ(1) = 1`,
    and let `rs` be a T_EB reaction list with no removal `X → ∅`. Let `I` be a time interval (a convex
    set of times) with `0 ∈ I` and let `x` solve the EB field of `rs` on `I` (`HasDerivWithinAt x (lift
    N q rs (x t)) I t` for `t ∈ I`), with `ψ''` the derivative of `ψ` at every visited `θ(t)`, `t ∈ I`,
    and with `θ(0) = 1`, `ξ(0) = 1` and `Σ_X pop_X(0) = 1 − q`. Then `qξ(t)ψ(θ(t)) + Σ_X pop_X(t) = 1`
    for every `t ∈ I`.'
  kind: dynamical
  impl:
  - NEP.node_conservation
  supporting: []
  impl_note: 'Hypotheses: ψ(1) = 1; no removal; Convex ℝ I, 0 ∈ I; x solves on I; ∀ t ∈ I, HasDerivAt
    N.ψ (N.ψ'' θ(t)) θ(t); θ(0) = 1, ξ(0) = 1, Σ_X pop_X(0) = 1 − q. Conclusion: ∀ t ∈ I, qξ(t)ψ(θ(t))
    + Σ_X pop_X(t) = 1 (written with CNet.susc). ψ''(1) ≠ 0 not needed.'
  required: true
  status: implemented
  notes: ''
- id: SemanticsMA.header.scope
  group: SemanticsMA
  source:
    file: NetworkEpi/Semantics/MA.lean
    lines: 6-12
  text: DESIGN_NetworkEpiCore.md §D.4, row **MA** ("Open(Petri) | x_X | total | **yes** (Baez–Pollard
    2017)") and §D.7 L3 (`maField`). This module covers the T_net reactions of `NRxn σ` (one susceptible
    species `s`, node species `σ`) in coordinates `(S, x)`, where `S` is the susceptible fraction and
    `x X` the fraction in node species `X`. Mass action is total on `NRxn σ`, so no admissibility condition
    is needed. The rate of each reaction is its written constant times the product of the reactant fractions
    (per DESIGN §D.2, a rate convention `c_λ` must be applied to the syntax before `maField` when the
    constants are per-contact rates).
  kind: structural
  impl: []
  supporting:
  - NEP.maLift_append
  - NEP.maLift_map
  - NEP.maLift_glue
  impl_note: 'Definitional: maField is defined on every NRxn σ constructor (total, no admissibility),
    with flux = written constant × product of reactant fractions (S for the susceptible species, x X otherwise;
    J = none catalyst reads S). The strictness column ''**yes** (Baez–Pollard 2017)'' is covered by SemanticsMA.maLiftAppend.
    The rate-convention remark (c_λ applied before maField) is a usage instruction.'
  required: false
  status: informal
  notes: Definitional / cross-reference.
- id: SemanticsMA.maLiftAppend
  group: SemanticsMA
  source:
    file: NetworkEpi/Semantics/MA.lean
    lines: 53-56,118-121,137-142,150-151
  text: |-
    **H1′ for mass action, part 1: the MA lift is additive in the reaction list.** Design statement (DESIGN_NetworkEpiCore.md §D.6): "H1′ same for MA, IB, Stoch | yes | same argument"; §D.4, table row MA, column "Strict under gluing?": "**yes** (Baez–Pollard 2017)".
    [...]
    **H1′ for mass action, part 2: the MA lift is natural in species maps.** Design statement (DESIGN_NetworkEpiCore.md §D.6): "H1′ same for MA, IB, Stoch | yes | same argument" (the argument of H1: "local per-reaction fields").
    [...]
    **H1′ for mass action: the MA lift is strict under gluing.** Design statement (DESIGN_NetworkEpiCore.md §D.6): "H1′ same for MA, IB, Stoch | yes | same argument", where H1 is "EB(glue(A,B)) = glue(EB A, EB B)"; §D.4, table row MA, column "Strict under gluing?": "**yes** (Baez–Pollard 2017)"; §D.3 (open systems): "composition identifies ported coordinates and **adds** vector fields".
    [...]
    Scope: of the design's "H1′ same for MA, IB, Stoch", only the mass-action case is formalised; the individual-based (IB) and stochastic semantics are not part of this library.
  kind: categorical
  impl:
  - NEP.maLift_append
  - NEP.maLift_map
  - NEP.maLift_glue
  supporting: []
  impl_note: 'maLift_append: maLift (rs ++ rs'') u = maLift rs u + maLift rs'' u for all rs rs'' : List
    (NRxn σ), u : MA σ = (S, x). maLift_map: for σ finite, f : σ → σ'': maLift (rs.map (NRxn.map f)) u
    = pushMA f (maLift rs (pullMA f u)) (pushMA keeps S and sums x over fibres; pullMA keeps S, precomposes
    x). maLift_glue: for a cospan f : σA → σ, g : σB → σ: maLift (A.map (NRxn.map f) ++ B.map (NRxn.map
    g)) u = pushMA f (maLift A (pullMA f u)) + pushMA g (maLift B (pullMA g u)). Gluing is relabelling
    along the cospan legs plus concatenation; the glued field is compared with the sum of pushed-forward
    component fields. NOT IN IMPL: ''IB, Stoch'' (no individual-based or stochastic semantics exists in
    the library; only MA); ''Baez–Pollard 2017'' is a citation (no open Petri net / black-boxing functor
    is formalised).'
  required: true
  status: implemented
  notes: 'Remediation (spot check): the quoted ''H1′ same for MA, IB, Stoch'' overclaims for this library;
    a Scope sentence (only MA is formalised) was added to maLift_glue''s docstring and to this text. Text
    changed: the checker must re-sync the sa_claim text; the existing MA-only shadows match the clarified
