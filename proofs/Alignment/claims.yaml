    [...]
    So `sSys` extends the library's mass-action semantics to reactions with several products.
    [...]
    every T_net reaction `NRxn σ` is a multiset reaction over `Option σ` (`none` is the susceptible species) with the same mass-action field.
  kind: dynamical
  impl:
  - NEP.ma_eq_stoich
  - NEP.maField_toSRxn
  supporting: []
  impl_note: '∀ finite σ (DecidableEq), rs : List (NRxn σ): IsSemiconj (maSys rs) (sSys (rs.map NRxn.toSRxn))
    maToS, maToS (S, x) = (none ↦ S, some X ↦ x_X). "Agrees" is expressed as a semiconjugacy along this
    linear coordinate change (its bijectivity is not stated), not as an equality of fields; the per-reaction
    equality maToS (maField r u) = r.toSRxn.field (maToS u) is maField_toSRxn, added to the impl because
    the header fragment states the per-reaction agreement. The design quotes (MA is total on Open(Petri);
