- id: SyntaxRxn.notEbAdmissibleResus
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 180-186
  text: 'Resusceptibility `X → s` (§B.2 type `:resus`, e.g. SIS `I → S`) is not EB-admissible (DESIGN
    executive summary: "The EB lift is strictly partial: SIS/SIRS are refused"). Design statement (DESIGN_NetworkEpiCore.md,
    executive summary item 6): "**The EB lift is strictly partial**: SIS/SIRS are refused with the alternatives
    named"; §B.2 table (the first ✗ is the EB column): "NodeTransition X ∉ Σ, Y ∈ Σ | `:resus` | I → S
    (SIS), R → S (SIRS), I₁ → R₁ when R₁ can be infected | ✗".'
  kind: structural
  impl:
  - NEP.NRxn.not_ebAdmissible_resus
  supporting: []
  impl_note: '∀ σ (X : σ) (a : ℝ), ¬ (NRxn.resus X a).EBAdmissible (true by definition of toRxn?). ''The
    EB lift is strictly partial'' is reflected only by ebField being defined on Rxn σ, which has no resus
    constructor; the Lean statement is about syntax, not about the non-existence of an EB semantics (the
    Scope sentence says so). NOT IN IMPL: ''refused with the alternatives named'' (runtime error messages);
    the §B.2 example ''I₁ → R₁ when R₁ can be infected'' needs several susceptible species and is not
    representable (one implicit susceptible species).'
  required: true
  status: implemented
  notes: 'Citable: NEP.NRxn.not_ebAdmissible_resus.'
