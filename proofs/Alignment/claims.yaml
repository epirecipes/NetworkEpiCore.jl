- id: Docs.readme.edgeDefectWithRemovals
  group: Docs
  source:
    file: README.md
    lines: 48-52
  text: 'For any reaction list, `d/dt (θ − φ_S − Σφ_X) = Σ_{(X→∅,a)∈rs} a φ_X` (`hasDerivAt_edgeDefect_lift`).
    A removal leaves θ unchanged and lowers Σφ by aφ_X (the partner becomes inert: its edges stay in θ
    but leave every φ class; `ebField_removal_row`), so the rate is non-negative when the removal rates
    and the φ_X are non-negative (`removalFlux_nonneg`). Without removals the rate is 0 (`removalFlux_eq_zero`). '
  kind: dynamical
  impl:
  - NEP.hasDerivAt_edgeDefect_lift
  - NEP.ebField_removal_row
  - NEP.ebField_removal_theta
  - NEP.removalFlux_nonneg
  - NEP.removalFlux_eq_zero
  supporting: []
  impl_note: 'hasDerivAt_edgeDefect_lift: for every reaction list rs (no removal hypothesis), HasDerivAt
    ψ'' (ψ'''' θ(t)) θ(t) → HasDerivAt x (lift N q rs (x t)) t → HasDerivAt (edgeDefect N q ∘ x) (removalFlux
    rs φ(t)) t, edgeDefect = θ − φ_S − Σφ_X, removalFlux rs φ = Σ_{(X → ∅, a) ∈ rs} a φ_X. ebField_removal_row:
    for trans X none a, the θ-component of ebField is 0, Σ_Y of the φ-components is −(a φ_X) (and of pop
    −(a pop_X)). removalFlux_nonneg: (∀ X a, trans X none a ∈ rs → 0 ≤ a) → (∀ X, 0 ≤ v X) → 0 ≤ removalFlux
    rs v. removalFlux_eq_zero: (∀ r ∈ rs, r.isRemoval = false) → removalFlux rs v = 0.'
  required: true
  status: implemented
  notes: 'Remediation: README wording clarified (the ''≥ 0'' needs non-negative rates and φ_X; ''with
    removals'' is a contrast, not a hypothesis: the identity holds for every list). Text changed: re-shadow
    blind. removalFlux_eq_zero needs the reviewed isRemoval bridge registered for this claim. Round-4
    remediation (non-blind owner, 2026-09-28): forward 2 failed because ebField_removal_row assumes [Fintype
    σ]. New trusted theorem ebField_removal_theta (θ-component of a removal is 0, any σ with DecidableEq)
    added to the impl; the old theorem is kept. Impl changed: checker update needed.'
