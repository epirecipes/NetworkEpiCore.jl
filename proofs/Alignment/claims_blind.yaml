  text: 'Contacts are fleeting, so a stub meets a uniformly random node: the edge probabilities `φ_X`
    of a configuration network are replaced by the node fractions `x_X`. The state is `(θ, ξ, x)` and
    the per-reaction field (`wmField`) is, with `S = qξe^{κ(θ−1)}`: ``` contact s + J → X + J (τ): θ̇
    += −τ x_J; x_X'' += κτ x_J S exit s → Y (ν): ξ̇ += −ν ξ; x_Y'' += ν S transition X → Y | ∅ (a): x_X''
    −= a x_X; x_Y'' += a x_X (no gain for ∅) ```'
