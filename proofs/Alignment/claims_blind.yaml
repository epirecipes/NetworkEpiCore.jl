  text: '**Edge conservation θ = φ_S + Σ_X φ_X is invariant along removal-free EB solutions.** Design
    statement (DESIGN_NetworkEpiCore.md §D.4, Evidence): "The exit terms were checked by hand. Conservation
    θ = φ_S + Σφ_X holds."; amended by §M.1: "For removal-free T_EB models (no `X → ∅`), θ = φ_S + Σφ_X
    is invariant along every solution on a time interval: if it holds at t = 0 it holds at every time
    of the interval. In particular, when ψ''(1) ≠ 0, it holds along solutions from the design''s initial
    condition θ(0) = ξ(0) = 1, Σφ_X(0) = 1 − q."'
- id: SemanticsEB.conservation.b
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 756-758
  text: 'The no-removal hypothesis is necessary: with removals `hasDerivWithinAt_edgeDefect_lift` gives
    `d/dt (θ − φ_S − Σφ) = Σ a φ_X` instead.'
- id: SemanticsEB.conservation.c
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 753-756
  text: 'Scope: global solutions are not required, and need not exist (numerically, EB SEIR on Poisson(5)
    with τ = 1/6, σ = 1/3, γ = 1/4 and φ_I(0) = 0.01 blows up backward at t ≈ −7.33). Forward solutions
    on `[0, T)` and local solutions on `(−ε, ε)` are covered, and `NEP.conservation_local` proves that
    a local solution meeting all the hypotheses exists.'
- id: SemanticsEB.nodeConservation
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 780-785
  text: '**Node conservation S + Σ_X pop_X = 1.** Let `N` be a configuration network with `ψ(1) = 1`,
    and let `rs` be a T_EB reaction list with no removal `X → ∅`. Let `I` be a time interval (a convex
    set of times) with `0 ∈ I` and let `x` solve the EB field of `rs` on `I` (`HasDerivWithinAt x (lift
    N q rs (x t)) I t` for `t ∈ I`), with `ψ''` the derivative of `ψ` at every visited `θ(t)`, `t ∈ I`,
    and with `θ(0) = 1`, `ξ(0) = 1` and `Σ_X pop_X(0) = 1 − q`. Then `qξ(t)ψ(θ(t)) + Σ_X pop_X(t) = 1`
    for every `t ∈ I`.'
- id: SemanticsMA.header.scope
  group: SemanticsMA
  source:
    file: NetworkEpi/Semantics/MA.lean
    lines: 6-12
  text: DESIGN_NetworkEpiCore.md §D.4, row **MA** ("Open(Petri) | x_X | total | **yes** (Baez–Pollard
    2017)") and §D.7 L3 (`maField`). This module covers the T_net reactions of `NRxn σ` (one susceptible
    species `s`, node species `σ`) in coordinates `(S, x)`, where `S` is the susceptible fraction and
    `x X` the fraction in node species `X`. Mass action is total on `NRxn σ`, so no admissibility condition
    is needed. The rate of each reaction is its written constant times the product of the reactant fractions
    (per DESIGN §D.2, a rate convention `c_λ` must be applied to the syntax before `maField` when the
    constants are per-contact rates).
