- id: SemanticsSolutions.header.hypothesesMet
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 11-12
  text: 'The conservation laws of `NetworkEpi.Semantics.EB` are stated for solutions on a time interval
    `I ∋ 0`. This module shows that their hypotheses can be met for every T_EB model:'
- id: SemanticsSolutions.header.bullets
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 14-24
  text: '* `contDiffAt_lift`: the EB field `lift N q rs` is `C^n` at every state whose θ is a point where
    ψ, ψ'', ψ'''' are `C^n`. `contDiff_lift`: if ψ, ψ'', ψ'''' are `C¹` everywhere (for example Poisson),
    the EB model `ebSys N q rs` is an object of the design''s category **Dyn**. * `exists_local_solution`:
    by the Picard–Lindelöf theorem, from every such state there is a solution on an open interval `(−ε,
    ε)`. * `conservation_local`: for every removal-free T_EB model on a network whose degree data are
    `C¹` near θ = 1, with `ψ''''` the derivative of `ψ''` near 1 and `ψ''(1) ≠ 0`, there is a solution
    on some `(−ε, ε)` from the design''s initial condition, and `θ = φ_S + Σ_X φ_X` holds along it. `conservation_local_poisson`
    specialises this to Poisson(μ), `μ ≠ 0`, and `seir_conservation_local` to EB SEIR on Poisson(5) with
    τ = 1/6, σ = 1/3, γ = 1/4 and φ_I(0) = 0.01: a model with no global solution (numerically, it blows
    up backward at t ≈ −7.33).'
