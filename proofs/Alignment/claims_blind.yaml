    φ_I(0) = pop_I(0) = 0.01 and q = 0.99 (so `Σ_X φ_X(0) = 1 − q`), there is a solution on some interval
    `(−ε, ε)` from `(θ, ξ, φ, pop)(0) = (1, 1, φ₀, p₀)` along which `θ = φ_S + Σ_X φ_X`.'
- id: SemanticsSolutions.seirConservationLocal.b
