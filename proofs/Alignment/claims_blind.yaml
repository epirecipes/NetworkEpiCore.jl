    list `rs` within a set of times `I` at the time `t`, and let `ψ''` be the derivative of `ψ` at `θ(t)`.
    Then, within `I` at `t`, `d/dt (S + Σ_X pop_X) = −Σ_{(X → ∅, a) ∈ rs} a pop_X`, where `S = qξψ(θ)`.'
