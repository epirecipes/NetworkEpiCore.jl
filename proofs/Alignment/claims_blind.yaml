- id: DynProducts.header.dynClosure
  group: DynProducts
  source:
    file: NetworkEpi/Dyn/Products.lean
    lines: 18-26
  text: '**Scope: `DynSys`, and the closure of the design''s Dyn.** `prod_isLimit`, `hasBinaryProducts`,
    `point_isTerminal` and `hasTerminal` are limits in `DynSys` (see `NetworkEpi.Dyn.Basic`). Because
    Dyn is not a full subcategory of `DynSys`, they do not by themselves imply that Dyn has these limits.
    The same constructions stay in the design''s **Dyn** (finite-dimensional, C¹): a product of finite-dimensional
    spaces with C¹ fields is finite-dimensional with a C¹ field, the projections are C¹, the pairing of
    two C¹ maps is C¹, `Fin 0 → ℝ` is finite-dimensional with the C¹ field 0, and the maps to it are C¹
    (`dyn_prod_closed`, `dyn_point_closed`). Uniqueness of the factorisation is inherited from `DynSys`,
    so Dyn has binary products and a terminal object, computed as in `DynSys`.'
