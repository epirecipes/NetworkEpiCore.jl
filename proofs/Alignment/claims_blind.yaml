- id: SyntaxRxn.header.typingTable
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 11-22
  text: |-
    The models are reaction networks on one susceptible species `s` (left implicit: it is the unique
    species of type `:sus`, DESIGN §B.2, "On an untyped network |Σ| = 1") and a type `σ` of node
    species (type `:node`). The typing of §B.2 is therefore built into the syntax:
    | constructor | §B.2 shape | §B.2 type | in T_EB? |
    |---|---|---|---|
    | `contact J X τ` | s + J → X + J (per-contact rate τ; J, X ∉ Σ; X = J allowed) | `:contact` | yes |
    | `exit Y ν` | s → Y (Y ∉ Σ) | `:exit` | yes |
    | `trans X (some Y) a` | X → Y (X, Y ∉ Σ) | `:progress` | yes |
    | `trans X none a` | X → ∅ | `:remove` | yes |
    | `NRxn.resus X a` | X → s | `:resus` | no |
    | `NRxn.nodeContact X J Y τ` | X + J → Y + J with X ∉ Σ (`J = none` is s) | `:node_contact` | no |
- id: SyntaxRxn.header.tebTnet
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 24-27
  text: '"**T_EB** = {contact, exit, progress, remove}: the sub-theory with **no arrow into Sus**. **T_net**
    = all eight types." (§B.2). With a single susceptible species, the §B.2 types `:sus_move` (S₁ → S₂)
    cannot occur and `:sus_contact` (a contact whose product or infector is susceptible) is not represented
    by `NRxn`; neither is admissible for EB.'
- id: SyntaxRxn.header.exitsToEmpty
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 29-32
  text: '**Exits to ∅.** §B.2 allows an exit `s → Y` with "Y ∉ Σ (or ∅)". The constructor `exit (Y : σ)`
    always names a node species, so `s → ∅` is not directly expressible. Model it with an *inert sink
    species* `D`: a node species that appears in no other reaction (no transition out of `D` and no contact
    with `D` as infector).'
- id: SyntaxRxn.header.inertSink
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 32-35
  text: In the EB field (`NetworkEpi.Semantics.EB`) no coordinate other than `φ_D` and `pop_D` depends
    on `φ_D` or `pop_D`, so θ, ξ, S and every other `φ_X`, `pop_X` evolve exactly as for `s → ∅`. `φ_D`
    and `pop_D` then record the removed edge and node mass, and the conservation laws count it.
- id: SyntaxRxn.header.admissibilityScope
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 37-43
  text: '**What the admissibility results say.** `EBAdmissible` is defined on the *syntax*: a T_net reaction
    is admissible if it lies in the image of the T_EB syntax `Rxn σ`. The results `ebAdmissible_iff_type`,
    `not_ebAdmissible_resus` and `exists_not_ebAdmissible` follow from the definitions by case analysis,
    because `EBAdmissible` and `TNet.inTEB` are parallel case tables. They say that the EB semantics of
    this library (`ebField`, defined on `Rxn σ`) has no input for `resus` or `nodeContact`. They do **not**
    prove that no EB-type semantics for `X → s` could exist.'
- id: SyntaxRxn.header.sisReason
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 43-45
  text: The design's reason for refusing SIS/SIRS is mathematical ("SIS has no exact edge-based model";
    a node that returns to Sus needs susceptible strata, which is pairwise, decision H6), and it is not
    formalised here.
- id: SyntaxRxn.toRxnToNRxn
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 130-130
  text: '`NRxn.toRxn?` is a left inverse of the inclusion `Rxn.toNRxn`.'
- id: SyntaxRxn.toNRxnInjective
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 134-134
  text: The inclusion of T_EB syntax into T_net syntax is injective.
- id: SyntaxRxn.ebAdmissibleIff
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 140-140
  text: EB-admissibility is exactly membership in the image of T_EB syntax.
- id: SyntaxRxn.ebAdmissibleIffType
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 153-169
  text: |-
    EB-admissibility is membership of the reaction's type in T_EB: "the sub-theory with no arrow into Sus" (DESIGN §B.2). Design statement (DESIGN_NetworkEpiCore.md §B.2): "**T_EB** = {contact, exit, progress, remove}: the sub-theory with **no arrow into Sus**. **T_net** = all eight types."
    [...]
    T_EB is the list {contact, exit, progress, remove}; the gloss "no arrow into Sus" does not characterise it in this syntax, since `nodeContact` (X + J → Y + J with X, Y ∉ Σ) has no arrow into Sus and is not in T_EB. `TNet` has six of the design's eight T_net types: `:sus_move` and `:sus_contact` need a second susceptible species or a susceptible product, which `NRxn` does not represent.
- id: SyntaxRxn.eqToNRxnOfEbAdmissible
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 175-175
  text: An EB-admissible T_net reaction comes from T_EB syntax.
- id: SyntaxRxn.notEbAdmissibleResus
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 180-186
  text: 'Resusceptibility `X → s` (§B.2 type `:resus`, e.g. SIS `I → S`) is not EB-admissible (DESIGN
    executive summary: "The EB lift is strictly partial: SIS/SIRS are refused"). Design statement (DESIGN_NetworkEpiCore.md,
    executive summary item 6): "**The EB lift is strictly partial**: SIS/SIRS are refused with the alternatives
    named"; §B.2 table (the first ✗ is the EB column): "NodeTransition X ∉ Σ, Y ∈ Σ | `:resus` | I → S
    (SIS), R → S (SIRS), I₁ → R₁ when R₁ can be infected | ✗".'
- id: SyntaxRxn.notEbAdmissibleNodeContact
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 197-198
  text: A node contact `X + J → Y + J` with a node-species recipient (§B.2 type `:node_contact`) is not
    EB-admissible.
- id: SyntaxRxn.existsNotEbAdmissible
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 203-207
  text: 'T_EB ⊊ T_net: some T_net reaction is not EB-admissible (the resusceptibility `X → s`). Design
    statement (DESIGN_NetworkEpiCore.md §D.1): "**Petri/T_EB ⊂ Petri/T_net ⊂ Petri**, and the back ends
    are defined on these: EB on Petri/T_EB"; executive summary item 6: "**The EB lift is strictly partial**".'
- id: SyntaxRxn.header.decidabilityExamples
  group: SyntaxRxn
  source:
    file: NetworkEpi/Syntax/Rxn.lean
    lines: 217-218
  text: 'Decidability in action (§B.2 examples): SIR is EB-admissible; SIS (`I → S`, a `:resus`) and an
    S-catalysed recovery `I + S → R + S` (a `:node_contact`) are not.'
