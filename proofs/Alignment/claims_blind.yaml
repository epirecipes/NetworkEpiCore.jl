- id: SemanticsEB.hasDerivWithinAtEdgeDefectLift
  group: SemanticsEB
  source:
    file: NetworkEpi/Semantics/EB.lean
    lines: 594-598
  text: '**Edge balance along EB solutions, with removals.** Let `x` solve the EB field of a T_EB reaction
    list `rs` within a set of times `I` at the time `t` (`HasDerivWithinAt`), and let `ψ''''` be the derivative
    of `ψ''` at `θ(t)`. Then, within `I` at `t`, `d/dt (θ − φ_S − Σ_X φ_X) = Σ_{(X → ∅, a) ∈ rs} a φ_X`.
    Removals `X → ∅` make the partner inert: its edges keep `θ` but leave every φ class, so the defect
    grows.'
- id: SemanticsEB.hasDerivWithinAtNodeTotalLift
