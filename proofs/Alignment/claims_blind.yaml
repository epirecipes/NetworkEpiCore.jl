- id: DynBasic.header.dynDesign
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 17-19
  text: 'The design (§D.3) says: "Objects of **Dyn** are (V, F): V a finite-dimensional real normed space,
    F: V → V a C¹ vector field. Morphisms (V, F) → (W, G) are C¹ maps π with Dπ(u)·F(u) = G(π(u)) (semiconjugacies).
    Identity and composition come from the chain rule."'
- id: DynBasic.header.dynSysGeneral
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 21-24
  text: 'The Lean category `DynSys` is deliberately *more general*: `V` is any real normed space (not
    necessarily finite-dimensional), `F` is any function `V → V` (no regularity), and a morphism is a
    map that is differentiable everywhere (not necessarily C¹) and satisfies `fderiv ℝ π u (F u) = G (π
    u)` for every `u`.'
- id: DynBasic.header.dynSubcategory
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 24-26
  text: The design's **Dyn** is therefore a subcategory of `DynSys` (same composition and identities),
    and every theorem below about all objects or all morphisms of `DynSys` holds in particular for **Dyn**.
- id: DynBasic.header.solutionDefs
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 28-31
  text: 'A *solution* of `(V, F)` on a set of times `I` is a curve `x : ℝ → V` with `HasDerivAt x (F (x
    t)) t` for every `t ∈ I` (`map_solution`, `map_solution_on`), or, on a time interval that may contain
    its end points (for example a forward solution on `[0, T)`), with `HasDerivWithinAt x (F (x t)) I
    t` for every `t ∈ I` (`map_solution_within`).'
- id: DynBasic.header.withinWeaker
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 31-32
  text: 'The second notion is weaker: `HasDerivAt` at `t` implies `HasDerivWithinAt` within any `I` at
    `t`.'
- id: DynBasic.header.globalSolutions
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 33-33
  text: Global solutions (`I = ℝ`) need not exist.
- id: DynBasic.semiconjIsSemiconj
  group: DynBasic
  source:
    file: NetworkEpi/Dyn/Basic.lean
    lines: 67-67
  text: A bundled semiconjugacy satisfies `IsSemiconj`.
- id: DynBasic.semiconjOnIsSemiconjOn
  group: DynBasic
  source:
