- id: SemanticsSolutions.existsLocalSolution
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 205-207
  text: '**Local existence of EB solutions (Picard–Lindelöf).** For every T_EB reaction list `rs` and
    every state `u₀` such that ψ, ψ'' and ψ'''' are `C¹` at `θ = u₀.1`, there are `ε > 0` and a curve
    `x` with `x 0 = u₀` that solves the EB field of `rs` (`HasDerivAt`) at every `t ∈ (−ε, ε)`.'
- id: SemanticsSolutions.conservationLocal
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 218-221
  text: '**Edge conservation along a local EB solution from the design''s initial condition.** Design
    statement (DESIGN_NetworkEpiCore.md §D.4, Evidence): "The exit terms were checked by hand. Conservation
    θ = φ_S + Σφ_X holds."'
- id: SemanticsSolutions.conservationLocalPoisson
  group: SemanticsSolutions
  source:
    file: NetworkEpi/Semantics/Solutions.lean
    lines: 293-296
  text: 'Edge conservation along a local solution on a Poisson(μ) network, `μ ≠ 0` (`conservation_local`
    for `CNet.poisson μ`): for every removal-free T_EB reaction list `rs` and initial data `φ₀, p₀` with
    `Σ_X φ₀(X) = 1 − q`, there are `ε > 0` and a solution on `(−ε, ε)` from `(1, 1, φ₀, p₀)` along which
    `θ = φ_S + Σ_X φ_X`.'
- id: SemanticsSolutions.seirConservationLocal
