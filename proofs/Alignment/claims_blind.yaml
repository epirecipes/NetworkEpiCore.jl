  text: 'Such a model still has local solutions on an interval `(−ε, ε)`: `NetworkEpi.Semantics.Solutions`
    proves that they exist for every T_EB model whose ψ, ψ'', ψ'''' are C¹ at the initial θ (`exists_local_solution`).'
