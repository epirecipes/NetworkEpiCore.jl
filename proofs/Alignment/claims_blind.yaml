    [...]
    if every new infection enters one state `E` (`F = e_E wᵀ`), the next-generation matrix `K = F V⁻¹ = e_E (wᵀV⁻¹)` has rank at most one and `R₀ = ρ(K) = |(wᵀV⁻¹)_E|`
