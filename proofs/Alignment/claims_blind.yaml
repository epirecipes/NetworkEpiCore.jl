- id: SemanticsPWS.header.fieldTable
  group: SemanticsPWS
  source:
    file: NetworkEpi/Semantics/PWS.lean
    lines: 13-17,20-24
  text: |-
    The state `w : PWS σ` is `([s], [ss], [sZ], [Z])`: the susceptible singles, the susceptible– susceptible pairs, the pairs `[sZ]` for node species `Z` and the singles `[Z]`. Triples are closed with a constant closure coefficient `K`: `[A s B] = K [As][sB]/[s]`. The per-reaction field is the one checked symbolically in the design pass (`check_pwS_general.py` for contacts and transitions, `check_exit_pws.py` for exits):
    [...]
    contact (s + J → X + J, τ): [s]' −= τ[sJ]; [ss]' −= 2τ[ssJ]; [X]' += τ[sJ]
    [sZ]' −= τ[Z s J] for every Z; [sJ]' −= τ[sJ]; [sX]' += τ[s s J]
    exit (s → Y, ν): [s]' −= ν[s]; [ss]' −= 2ν[ss]; [sZ]' −= ν[sZ] for every Z;
    [sY]' += ν[ss]; [Y]' += ν[s]
    trans (X → Y | ∅, a): [sX]' −= a[sX]; [sY]' += a[sX]; [X]' −= a[X]; [Y]' += a[X]
